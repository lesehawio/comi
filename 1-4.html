<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>اجزای کیس — سطح ۱ / جلسه ۴</title>
<style>
/* ============================================================
   سطح ۱ — جلسه ۴ : اجزای کیس
   دکمه‌ی پاور • ریستارت • پورت USB • جک هدفون
   فن • پورت‌های پشت • سوکت برق

   تک‌فایل • آفلاین • بدون تصویر بیرونی
   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:5px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay,
#home{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .12s ease, background .2s;
}

#replay:active,
#home:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:170px;
    position:relative;
    perspective:900px;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
    transition:transform .5s cubic-bezier(.2,.8,.3,1);
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
}

#scene g.part{ transition:opacity .4s ease; }

#scene.focusing g.part{ opacity:.2; }

#scene.focusing g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(74,222,128,.95));
}

#scene g.part.hit{
    filter:drop-shadow(0 0 16px rgba(74,222,128,1));
}

#scene g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.32; }
    50%{ opacity:1; }
}

#spotRing{
    opacity:0;
    transition:opacity .35s ease;
}

#spotRing.show{
    opacity:1;
    animation:ringPulse 1.5s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{ stroke-width:2.5; opacity:.55; }
    50%{ stroke-width:5; opacity:1; }
}

/* دو نمای کیس: رو و پشت */
#viewFront,
#viewBack{
    transition:opacity .5s ease;
}

#viewBack{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewFront{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewBack{
    opacity:1;
    pointer-events:auto;
}

#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
    max-height:48vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    align-content:flex-start;
}

.btn{
    flex:1;
    min-width:118px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

.btn.big{
    flex:1 0 100%;
    min-height:86px;
    font-size:20px;
    flex-direction:column;
    gap:5px;
    line-height:1.3;
    padding:12px;
}

.btn.big small{
    display:block;
    font-size:13.5px;
    font-weight:normal;
    opacity:.75;
}

#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12); }
    50%{ box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22); }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    width:86px;
    height:86px;
    filter:drop-shadow(0 0 20px rgba(74,222,128,.95));
    animation:popOk .85s ease-out forwards;
}

#burst .ok path{
    fill:none;
    stroke:#4ade80;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:72;
    stroke-dashoffset:72;
    animation:drawCheck .5s ease forwards .05s;
}

@keyframes drawCheck{
    to{ stroke-dashoffset:0; }
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

.star{
    position:fixed;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

/* =========================
   کیس سه‌بعدی — بازی آزاد
   ========================= */

#case3d{
    --k3scale:.5;
    --k3rx:12deg;
    --k3ry:-25deg;
    position:absolute;
    inset:0;
    display:none;
    perspective:1600px;
    perspective-origin:50% 45%;
    overflow:hidden;
    touch-action:none;
}

#case3d.show{ display:block; }

.k3-stage{
    position:absolute;
    left:50%;
    top:50%;
    width:0;
    height:0;
    transform-style:preserve-3d;
    transform:scale(var(--k3scale)) rotateX(var(--k3rx)) rotateY(var(--k3ry));
    transition:transform .07s linear;
    cursor:grab;
}

.k3-model{
    position:absolute;
    left:-140px;
    top:-260px;
    width:280px;
    height:520px;
    transform-style:preserve-3d;
}

.k3-body{
    position:absolute;
    left:0;
    top:0;
    width:280px;
    height:520px;
    border-radius:7px;
    background:linear-gradient(115deg,#2c2f36 0%,#1e2126 45%,#14161a 100%);
    border:1px solid #0a0b0e;
    box-shadow:
        inset 3px 3px 8px rgba(255,255,255,.05),
        inset -3px -3px 12px rgba(0,0,0,.5),
        0 30px 60px rgba(0,0,0,.7);
    transform-style:preserve-3d;
}

.k3-side{
    position:absolute;
    left:8px;
    top:8px;
    width:264px;
    height:504px;
    border-radius:6px;
    background:linear-gradient(90deg,#0e0f12 0%,#26292f 40%,#1a1c21 70%,#0a0b0e 100%);
    border:1px solid #050608;
    transform:translateZ(-22px);
    box-shadow:0 15px 25px rgba(0,0,0,.6);
}

.k3-front{
    position:absolute;
    left:5px;
    top:5px;
    width:270px;
    height:510px;
    border-radius:6px;
    background:linear-gradient(105deg,#2a2d34 0%,#1c1f24 50%,#14161a 100%);
    border:1px solid rgba(80,80,90,.5);
    transform:translateZ(12px);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.06),
        inset -2px -2px 8px rgba(0,0,0,.4);
    overflow:hidden;
}

/* دکمه‌ی پاور */
.k3-power{
    position:absolute;
    top:35px;
    right:35px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3a3d44 0%,#1a1c21 70%,#0a0b0e 100%);
    border:2px solid #2a2d34;
    cursor:pointer;
    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.15),
        inset 0 -2px 6px rgba(0,0,0,.6),
        0 2px 5px rgba(0,0,0,.5);
    transition:all .15s ease;
    z-index:10;
}

.k3-power::before{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    margin:-9px 0 0 -9px;
    border:2.5px solid #555;
    border-top-color:transparent;
    border-radius:50%;
    transition:border-color .3s ease;
}

.k3-power::after{
    content:'';
    position:absolute;
    left:50%;
    top:9px;
    width:2.5px;
    height:11px;
    background:#555;
    transform:translateX(-50%);
    transition:background .3s ease;
}

.k3-power.pressed{
    transform:translateY(2px) scale(.96);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.7);
}

#case3d.on .k3-power::before{
    border-color:#33ff77;
    border-top-color:transparent;
    box-shadow:0 0 8px rgba(50,255,120,.7);
}

#case3d.on .k3-power::after{
    background:#33ff77;
    box-shadow:0 0 8px rgba(50,255,120,.9);
}

#case3d.on .k3-power{
    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.1),
        inset 0 -2px 6px rgba(0,0,0,.5),
        0 0 12px rgba(50,255,120,.5),
        0 0 25px rgba(50,255,120,.25);
}

/* دکمه‌ی ریستارت */
.k3-reset{
    position:absolute;
    top:35px;
    right:95px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#3a3d44 0%,#1a1c21 70%,#0a0b0e 100%);
    border:2px solid #2a2d34;
    cursor:pointer;
    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.12),
        inset 0 -2px 4px rgba(0,0,0,.6),
        0 2px 4px rgba(0,0,0,.5);
    transition:all .15s ease;
    z-index:10;
}

.k3-reset::before{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:14px;
    height:14px;
    margin:-7px 0 0 -7px;
    border:2px solid #555;
    border-right-color:transparent;
    border-radius:50%;
}

.k3-reset.pressed{
    transform:translateY(2px) scale(.95);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.7);
}

.k3-reset.warn::before{
    border-color:#ffaa33;
    border-right-color:transparent;
}

/* پورت‌ها */
.k3-ports{
    position:absolute;
    top:110px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:5;
}

.k3-row{
    display:flex;
    gap:6px;
    align-items:center;
}

.k3-port{
    width:22px;
    height:14px;
    background:linear-gradient(180deg,#0a0b0e 0%,#1a1c21 50%,#0a0b0e 100%);
    border:1px solid #2a2d34;
    border-radius:2px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8);
}

.k3-jack{
    width:14px;
    height:14px;
    border-radius:50%;
    background:radial-gradient(circle,#000 0%,#0a0b0e 50%,#2a2d34 100%);
    border:1px solid #2a2d34;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.9);
}

/* نوار RGB */
.k3-rgb{
    position:absolute;
    left:0;
    right:0;
    top:160px;
    height:3px;
    background:linear-gradient(90deg,#ff0044 0%,#ff8800 20%,#ffee00 40%,#00ff88 60%,#0088ff 80%,#8800ff 100%);
    opacity:.32;
    transition:opacity .5s ease;
    box-shadow:0 0 8px rgba(255,255,255,.3);
}

#case3d.on .k3-rgb{
    opacity:1;
    animation:k3Rgb 3s linear infinite;
    box-shadow:0 0 12px rgba(255,255,255,.5), 0 0 24px rgba(100,150,255,.3);
}

@keyframes k3Rgb{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
}

/* فن‌ها */
.k3-fan{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#0a0b0e 0%,#1a1c21 50%,#2a2d34 75%,#0a0b0e 100%);
    border:2px solid #1a1c21;
    box-shadow:inset 0 0 10px rgba(0,0,0,.9), 0 0 5px rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.k3-fan1{ top:230px; left:50%; margin-left:-45px; }
.k3-fan2{ top:340px; left:50%; margin-left:-45px; }

.k3-blades{
    width:100%;
    height:100%;
    border-radius:50%;
    opacity:.85;
    background:conic-gradient(
        from 0deg,
        #2a2d34 0deg,#0a0b0e 30deg,#2a2d34 45deg,#0a0b0e 75deg,
        #2a2d34 90deg,#0a0b0e 120deg,#2a2d34 135deg,#0a0b0e 165deg,
        #2a2d34 180deg,#0a0b0e 210deg,#2a2d34 225deg,#0a0b0e 255deg,
        #2a2d34 270deg,#0a0b0e 300deg,#2a2d34 315deg,#0a0b0e 345deg,
        #2a2d34 360deg
    );
}

#case3d.on .k3-blades{ animation:k3Spin 1.2s linear infinite; }

@keyframes k3Spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

.k3-hub{
    position:absolute;
    width:30%;
    height:30%;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#3a3d44 0%,#1a1c21 70%,#0a0b0e 100%);
    border:1px solid #2a2d34;
}

/* پاها */
.k3-foot{
    position:absolute;
    width:40px;
    height:14px;
    border-radius:3px;
    background:linear-gradient(180deg,#1a1c21,#0a0b0e);
    transform:translateZ(-28px);
    box-shadow:0 3px 5px rgba(0,0,0,.8);
}

.k3-f1{ left:25px; bottom:15px; }
.k3-f2{ right:25px; bottom:15px; }

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    .btn.big{ min-height:74px; font-size:18px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
    #case3d{ --k3scale:.4; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="home" title="منو" aria-label="منو">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.6 12 3.2l9 7.4"/>
                <path d="M6 9.6V20.5h12V9.6"/>
            </svg>
        </button>
        <button id="replay" title="دوباره" aria-label="دوباره">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.7-6"/>
                <path d="M20.5 3.5V9H15"/>
            </svg>
        </button>
    </div>

    <div id="stage">
        <!-- ============================================================
             صحنه‌ی کیس — نمای رو و نمای پشت
             ============================================================ -->
        <svg id="scene" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gCase" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#414a58"/>
                    <stop offset=".5" stop-color="#262d38"/>
                    <stop offset="1" stop-color="#171c24"/>
                </linearGradient>
                <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#2b333f"/>
                    <stop offset="1" stop-color="#1e242e"/>
                </linearGradient>
                <linearGradient id="gBackC" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#333b47"/>
                    <stop offset="1" stop-color="#1a2029"/>
                </linearGradient>
                <radialGradient id="gFanG">
                    <stop offset="0" stop-color="#0c1118"/>
                    <stop offset="1" stop-color="#1e242e"/>
                </radialGradient>
                <pattern id="pMesh" width="12" height="12" patternUnits="userSpaceOnUse">
                    <rect width="12" height="12" fill="#141922"/>
                    <circle cx="6" cy="6" r="3.4" fill="#080c12"/>
                </pattern>
                <filter id="fSoftC" x="-60%" y="-60%" width="220%" height="220%">
                    <feGaussianBlur stdDeviation="6"/>
                </filter>
            </defs>

            <!-- کف -->
            <rect x="0" y="300" width="400" height="40" fill="#121924"/>
            <rect x="0" y="300" width="400" height="1.6" fill="#2b3644"/>
            <ellipse cx="200" cy="303" rx="96" ry="7" fill="#000" opacity=".5" filter="url(#fSoftC)"/>

            <!-- ============================================
                 نمای رو
                 ============================================ -->
            <g id="viewFront">

                <!-- بدنه -->
                <rect x="120" y="40" width="160" height="260" rx="9" fill="url(#gCase)" stroke="#080b10" stroke-width="2"/>
                <rect x="128" y="48" width="144" height="244" rx="7" fill="url(#gPanel)"/>

                <!-- مش جلویی -->
                <rect x="140" y="186" width="120" height="98" rx="5" fill="url(#pMesh)"/>

<div id="burst"></div>

<script>
/* ============================================================
   ۱) محتوای درس‌ها
   ============================================================ */

var PARTS = {
    power: ['دکمه‌ی پاور',    'با این کامپیوتر روشن می‌شه. یه بار کوتاه بزن.'],
    reset: ['دکمه‌ی ریستارت', 'این رو الکی نزن! فقط وقتی کامپیوتر کامل گیر کرد.'],
    usb:   ['پورت USB',      'فلش و ماوس اینجا وصل می‌شن.'],
    jack:  ['جک هدفون',      'هدفون و میکروفون اینجا می‌رن.'],
    fan:   ['فن',            'گرمای داخل رو بیرون می‌ده. راهش رو نبند.'],
    ports: ['پورت‌های پشت',   'کیبورد و ماوس و مانیتور هم اینجا وصل می‌شن.'],
    psu:   ['سوکت برق',      'کابل برق اینجا وصل می‌شه.']
};

/* محل حلقه‌ی نشانگر: [cx, cy, rx, ry] */
var RING_POS = {
    power: [238, 76, 33, 33],
    reset: [238, 126, 27, 27],
    usb:   [159, 84, 34, 34],
    jack:  [152, 143, 26, 38],
    fan:   [200, 88, 54, 54],
    ports: [200, 181, 76, 47],
    psu:   [200, 259, 76, 42]
};

/* محل دست راهنما */
var HINT_POS = {
    power: [238, 42],
    reset: [238, 94],
    usb:   [159, 42],
    jack:  [152, 102],
    fan:   [200, 30],
    ports: [200, 124],
    psu:   [200, 208]
};

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'power' },
    { t:'teach', part:'reset' },
    { t:'teach', part:'usb'   },
    { t:'teach', part:'jack'  },

    { t:'find',  part:'power', ask:'دکمه‌ی پاور رو پیدا کن'  },
    { t:'find',  part:'usb',   ask:'پورت USB رو پیدا کن'    },
    { t:'find',  part:'jack',  ask:'جک هدفون رو پیدا کن'    },
    { t:'find',  part:'reset', ask:'دکمه‌ی ریستارت رو پیدا کن' },

    { t:'name',  part:'power' },
    { t:'name',  part:'usb'   },
    { t:'name',  part:'jack'  },

    { t:'teach', part:'fan',   flip:true },
    { t:'teach', part:'ports', flip:true },
    { t:'teach', part:'psu',   flip:true },

    { t:'find',  part:'fan',   flip:true, ask:'فن رو پیدا کن'          },
    { t:'find',  part:'ports', flip:true, ask:'پورت‌های پشت رو پیدا کن' },
    { t:'find',  part:'psu',   flip:true, ask:'سوکت برق رو پیدا کن'    },

    { t:'chain', parts:['power','usb','jack','reset'] }
];

/* ============================================================
   ۲) موتور برنامه
   ============================================================ */

var scene    = document.getElementById('scene');
var k3El     = document.getElementById('case3d');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var homeEl   = document.getElementById('home');
var replayEl = document.getElementById('replay');
var titleEl  = document.getElementById('title');
var textEl   = document.getElementById('text');
var actEl    = document.getElementById('actions');
var burstEl  = document.getElementById('burst');
var panelIn  = document.getElementById('panelInner');
var handEl   = document.getElementById('hintHand');
var ringEl   = document.getElementById('spotRing');

var i = 0;
var chainIdx = 0;
var wrongCount = 0;
var lock = false;
var mode = 'menu';

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function partEl(name){
    return scene.querySelector('[data-part="' + name + '"]');
}

function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function clearMarks(){
    var all = scene.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
    ringEl.classList.remove('show');
}

function showRing(part){
    var r = RING_POS[part];
    if(!r) return;
    ringEl.setAttribute('cx', r[0]);
    ringEl.setAttribute('cy', r[1]);
    ringEl.setAttribute('rx', r[2]);
    ringEl.setAttribute('ry', r[3]);
    ringEl.classList.add('show');
}

function showHand(part){
    var p = HINT_POS[part];
    if(!p) return;
    handEl.setAttribute('transform','translate(' + p[0] + ',' + p[1] + ')');
    handEl.classList.add('show');
}

function showBurst(){
    burstEl.innerHTML =
        '<div class="ring"></div>' +
        '<svg class="ok" viewBox="0 0 64 64">' +
        '<path d="M13 33 L26 46 L51 18"/></svg>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<16;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28">' +
                          '<path d="M12 2.2l2.95 6.05 6.65.95-4.8 4.7 1.15 6.65L12 17.4l-5.95 3.15L7.2 13.9 2.4 9.2l6.65-.95z" ' +
                          'fill="#ffd257"/></svg>';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (28 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            if(item.html){ b.innerHTML = item.html; }
            else { b.textContent = item.label; }
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ---------------- نوار بالا و حالت‌ها ---------------- */

function setTop(progress, home, replay){
    countEl.style.display  = progress ? '' : 'none';
    dotsEl.style.display   = progress ? '' : 'none';
    homeEl.style.display   = home ? '' : 'none';
    replayEl.style.display = replay ? '' : 'none';
}

function showMenu(){
    mode = 'menu';
    render();
}

function startLesson(){
    mode = 'lesson';
    i = 0;
    render();
}

function showCase3D(){
    mode = 'case3d';
    render();
}

/* ---------------- صفحه‌ی منو ---------------- */

function renderMenu(){
    scene.style.display = '';
    k3El.classList.remove('show');
    clearMarks();
    replayAnim();
    setTop(false, false, false);
    titleEl.textContent = 'جلسه‌ی ۴ — کیس';
    textEl.textContent  = 'کدوم قسمت رو می‌خوای ببینی؟';
    setButtons([
        {
            html: 'شروع درس<small>پاور • ریستارت • USB • هدفون • فن • پورت‌های پشت</small>',
            cls: 'big main',
            onClick: startLesson
        },
        {
            html: 'کیس سه‌بعدی<small>بچرخونش و پاورش رو بزن</small>',
            cls: 'big',
            onClick: showCase3D
        }
    ]);
}

/* ---------------- بازی آزاد سه‌بعدی ---------------- */

function renderCase3D(){
    scene.style.display = 'none';
    k3El.classList.add('show');
    clearMarks();
    replayAnim();
    setTop(false, true, false);
    titleEl.textContent = 'کیس سه‌بعدی';
    textEl.textContent  = 'بچرخونش. بعد دکمه‌ی پاور رو بزن تا روشن شه.';
    setButtons([{ label:'برگشت به منو', cls:'main', onClick: showMenu }]);
}

/* ---------------- نمایش مرحله ---------------- */

function render(){
    if(mode === 'menu'){ renderMenu(); return; }
    if(mode === 'case3d'){ renderCase3D(); return; }

    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    chainIdx = 0;
    clearMarks();
    replayAnim();

    scene.style.display = '';
    k3El.classList.remove('show');
    setTop(true, true, true);

    if(s.flip){ scene.classList.add('flip'); }
    else { scene.classList.remove('flip'); }

    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        titleEl.textContent = 'کیس رو بشناسیم';
        textEl.textContent  = 'کیس جعبه‌ی اصلیه. همه‌ی کارهای کامپیوتر توش انجام می‌شه. مثل مغز.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی قطعه ---------- */
    if(s.t === 'teach'){
        var p = PARTS[s.part];
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = p[0];
        textEl.textContent  = p[1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- این چیه؟ ---------- */
    if(s.t === 'name'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = 'این چیه؟';
        textEl.textContent  = 'روی جواب درست بزن.';

        var others = [];
        for(var key in PARTS){
            if(key !== s.part){ others.push(key); }
        }
        others.sort(function(){ return Math.random() - 0.5; });

        var choices = [s.part, others[0], others[1]];
        choices.sort(function(){ return Math.random() - 0.5; });

        var list = [];
        for(var c=0;c<choices.length;c++){
            (function(name){
                list.push({
                    label: PARTS[name][0],
                    onClick: function(){
                        if(name === s.part){ correct(partEl(name)); }
                        else { wrongAnswer(); }
                    }
                });
            })(choices[c]);
        }
        setButtons(list);
        return;
    }

    /* ---------- زنجیره‌ی پایانی ---------- */
    if(s.t === 'chain'){
        renderChain();
        return;
    }
}

function renderChain(){
    var s = LESSON[i];
    var want = s.parts[chainIdx];
    clearMarks();
    titleEl.textContent = 'نشونم بده';
    textEl.textContent  = PARTS[want][0] + ' رو پیدا کن   (' +
                          fa(chainIdx + 1) + ' از ' + fa(s.parts.length) + ')';
    setButtons([]);
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

/* ---------------- بازخورد ---------------- */

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();

    setTimeout(function(){
        var s = LESSON[i];

        if(s.t === 'chain'){
            if(chainIdx < s.parts.length - 1){
                chainIdx++;
                lock = false;
                renderChain();
            } else {
                stars();
                titleEl.textContent = 'آفرین!';
                textEl.textContent  = 'همه‌ی قسمتای کیس رو شناختی.';
                setButtons([{ label:'برگشت به منو', cls:'main', onClick: showMenu }]);
            }
            return;
        }

        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';

    var s = LESSON[i];
    var want = s.t === 'chain' ? s.parts[chainIdx] : s.part;

    if(wrongCount >= 2 && want){
        partEl(want).classList.add('hint');
        showHand(want);
        if(s.t !== 'chain'){ showRing(want); }
    }
}

/* ---------------- کلیک روی صحنه ---------------- */

scene.addEventListener('click', function(e){
    if(mode !== 'lesson' || lock || suppressClick) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        if(tapped === s.part){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'chain'){
        if(tapped === s.parts[chainIdx]){ correct(g); } else { wrongAnswer(); }
    }
});

/* ---------------- دکمه‌ها ---------------- */

replayEl.onclick = function(){
    vibrate(20);
    render();
};

homeEl.onclick = function(){
    vibrate(20);
    showMenu();
};

/* ---------------- چرخش ملایم صحنه‌ی SVG ---------------- */

var stageEl = document.getElementById('stage');
var dragX = 0, dragY = 0, dragging = false, moved = false, suppressClick = false;

stageEl.addEventListener('pointerdown', function(e){
    if(k3El.classList.contains('show')) return;
    dragging = true;
    moved = false;
    dragX = e.clientX;
    dragY = e.clientY;
});

stageEl.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dragX;
    var dy = e.clientY - dragY;
    if(Math.abs(dx) + Math.abs(dy) > 10){ moved = true; }
    if(!moved) return;

    var ry = Math.max(-16, Math.min(16, dx * 0.16));
    var rx = Math.max(-12, Math.min(12, -dy * 0.12));
    scene.style.setProperty('--ry', ry + 'deg');
    scene.style.setProperty('--rx', rx + 'deg');
});

function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(moved){
        scene.style.setProperty('--ry', '0deg');
        scene.style.setProperty('--rx', '0deg');
        suppressClick = true;
        setTimeout(function(){ suppressClick = false; }, 160);
    }
}

stageEl.addEventListener('pointerup', endDrag);
stageEl.addEventListener('pointercancel', endDrag);
stageEl.addEventListener('pointerleave', endDrag);

/* ============================================================
   کیس سه‌بعدی
   ============================================================ */

var k3    = k3El;
var k3rx  = 12;
var k3ry  = -25;
var k3on  = false;
var k3lx  = 0;
var k3ly  = 0;

k3.addEventListener('pointerdown', function(e){
    if(e.target.closest('.k3-power') || e.target.closest('.k3-reset')) return;
    k3on = true;
    k3lx = e.clientX;
    k3ly = e.clientY;
    try{ k3.setPointerCapture(e.pointerId); }catch(err){}
});

k3.addEventListener('pointermove', function(e){
    if(!k3on) return;
    var dx = e.clientX - k3lx;
    var dy = e.clientY - k3ly;
    k3ry += dx * 0.45;
    k3rx -= dy * 0.42;
    k3rx = Math.max(-22, Math.min(62, k3rx));
    k3.style.setProperty('--k3rx', k3rx + 'deg');
    k3.style.setProperty('--k3ry', k3ry + 'deg');
    k3lx = e.clientX;
    k3ly = e.clientY;
});

function k3Stop(){ k3on = false; }

k3.addEventListener('pointerup', k3Stop);
k3.addEventListener('pointercancel', k3Stop);

/* دکمه‌ی پاور */
var k3powerEl = document.getElementById('k3power');
var k3state = false;

k3powerEl.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    k3powerEl.classList.add('pressed');
    k3state = !k3state;
    if(k3state){ k3.classList.add('on'); } else { k3.classList.remove('on'); }
    vibrate(k3state ? [30, 40, 30] : 45);
});

function k3powerUp(e){
    e.stopPropagation();
    k3powerEl.classList.remove('pressed');
}

k3powerEl.addEventListener('pointerup', k3powerUp);
k3powerEl.addEventListener('pointerleave', k3powerUp);
k3powerEl.addEventListener('pointercancel', k3powerUp);

/* دکمه‌ی ریستارت — فقط هشدار، نه ریست واقعی */
var k3resetEl = document.getElementById('k3reset');

k3resetEl.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    k3resetEl.classList.add('pressed','warn');
    vibrate([50, 40, 50]);
    textEl.textContent = 'این دکمه رو الکی نزن! فقط وقتی کامپیوتر کامل گیر کرد.';
});

function k3resetUp(e){
    e.stopPropagation();
    k3resetEl.classList.remove('pressed');
    setTimeout(function(){ k3resetEl.classList.remove('warn'); }, 500);
}

k3resetEl.addEventListener('pointerup', k3resetUp);
k3resetEl.addEventListener('pointerleave', k3resetUp);
k3resetEl.addEventListener('pointercancel', k3resetUp);

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ---------------- شروع ---------------- */
render();
</script>

</body>
</html>
