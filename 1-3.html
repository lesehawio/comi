<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>اجزای مانیتور — سطح ۱ / جلسه ۳</title>
<style>
/* ============================================================
   سطح ۱ — جلسه ۳ : اجزای مانیتور
   صفحه • پایه • دکمه‌ی پاور • چراغ • دکمه‌های تنظیم
   کابل برق • کابل تصویر (نمای پشت)

   تک‌فایل • آفلاین • بدون تصویر بیرونی
   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:5px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay,
#home{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .12s ease, background .2s;
}

#replay:active,
#home:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:170px;
    position:relative;
    perspective:900px;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
    transition:transform .5s cubic-bezier(.2,.8,.3,1);
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
}

#scene g.part{ transition:opacity .4s ease; }

#scene.focusing g.part{ opacity:.2; }

#scene.focusing g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(74,222,128,.95));
}

#scene g.part.hit{
    filter:drop-shadow(0 0 16px rgba(74,222,128,1));
}

#scene g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.32; }
    50%{ opacity:1; }
}

#spotRing{
    opacity:0;
    transition:opacity .35s ease;
}

#spotRing.show{
    opacity:1;
    animation:ringPulse 1.5s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{ stroke-width:2.5; opacity:.55; }
    50%{ stroke-width:5; opacity:1; }
}

/* دو نمای مانیتور: رو و پشت */
#viewFront,
#viewBack{
    transition:opacity .5s ease;
}

#viewBack{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewFront{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewBack{
    opacity:1;
    pointer-events:auto;
}

/* چراغ روی صفحه */
#led{
    fill:#3d4553;
    transition:fill .4s ease;
}

#scene.on #led{
    fill:#4ade80;
    filter:drop-shadow(0 0 4px rgba(74,222,128,1));
}

#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
    max-height:48vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    align-content:flex-start;
}

.btn{
    flex:1;
    min-width:118px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

.btn.chip{
    flex:0 0 auto;
    min-width:0;
    min-height:46px;
    font-size:14.5px;
    padding:0 13px;
    border-radius:13px;
}

.btn.big{
    flex:1 0 100%;
    min-height:86px;
    font-size:20px;
    flex-direction:column;
    gap:5px;
    line-height:1.3;
    padding:12px;
}

.btn.big small{
    display:block;
    font-size:13.5px;
    font-weight:normal;
    opacity:.75;
}

#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12); }
    50%{ box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22); }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    width:86px;
    height:86px;
    filter:drop-shadow(0 0 20px rgba(74,222,128,.95));
    animation:popOk .85s ease-out forwards;
}

#burst .ok path{
    fill:none;
    stroke:#4ade80;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:72;
    stroke-dashoffset:72;
    animation:drawCheck .5s ease forwards .05s;
}

@keyframes drawCheck{
    to{ stroke-dashoffset:0; }
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

.star{
    position:fixed;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    .btn.chip{ min-height:46px; font-size:14.5px; }
    .btn.big{ min-height:74px; font-size:18px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="home" title="منو" aria-label="منو">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.6 12 3.2l9 7.4"/>
                <path d="M6 9.6V20.5h12V9.6"/>
            </svg>
        </button>
        <button id="replay" title="دوباره" aria-label="دوباره">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.7-6"/>
                <path d="M20.5 3.5V9H15"/>
            </svg>
        </button>
    </div>

    <div id="stage">
        <!-- ============================================================
             صحنه‌ی مانیتور — نمای رو و نمای پشت
             ============================================================ -->
        <svg id="scene" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#414a58"/>
                    <stop offset="1" stop-color="#1e242d"/>
                </linearGradient>
                <linearGradient id="gScr" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#1d4f7a"/>
                    <stop offset="1" stop-color="#123449"/>
                </linearGradient>
                <linearGradient id="gStand" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#242b35"/>
                    <stop offset=".45" stop-color="#3a424e"/>
                    <stop offset="1" stop-color="#1d232c"/>
                </linearGradient>
                <linearGradient id="gBack" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#333b47"/>
                    <stop offset="1" stop-color="#1a2029"/>
                </linearGradient>
                <filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%">

                </filter>
                <clipPath id="clipScreen">
                    <rect x="52" y="42" width="296" height="170" rx="6"/>
                </clipPath>
            </defs>

            <!-- میز -->
            <rect x="0" y="294" width="400" height="46" fill="#121924"/>
            <rect x="0" y="294" width="400" height="1.6" fill="#2b3644"/>

            <!-- سایه -->
            <ellipse cx="200" cy="296" rx="105" ry="7" fill="#000" opacity=".5" filter="url(#fSoft)"/>

            <!-- ============================================
                 نمای رو
                 ============================================ -->
            <g id="viewFront">

                <!-- پایه -->
                <g data-part="stand" class="part">
                    <rect x="185" y="240" width="30" height="42" fill="url(#gStand)"/>
                    <rect x="130" y="280" width="140" height="15" rx="7.5" fill="url(#gStand)" stroke="#0a0e14" stroke-width="1.2"/>
                    <rect x="150" y="238" width="100" height="44" rx="6" fill="transparent" pointer-events="all"/>
                </g>

                <!-- بدنه + صفحه -->
                <g data-part="screen" class="part">
                    <rect x="40" y="30" width="320" height="210" rx="13" fill="url(#gBody)" stroke="#0a0e14" stroke-width="2"/>
                    <rect x="52" y="42" width="296" height="170" rx="6" fill="url(#gScr)"/>

                    <!-- پنجره روی صفحه -->
                    <rect x="150" y="72" width="150" height="86" rx="5" fill="#eef3f9"/>
                    <rect x="150" y="72" width="150" height="16" rx="5" fill="#c6d0dc"/>
                    <circle cx="288" cy="80" r="4" fill="#e0655f"/>
                    <rect x="162" y="98" width="92" height="6" rx="3" fill="#cdd7e2"/>
                    <rect x="162" y="112" width="70" height="6" rx="3" fill="#dbe3ec"/>
                    <rect x="162" y="126" width="84" height="6" rx="3" fill="#dbe3ec"/>

                    <!-- آیکون‌های کوچک -->
                    <rect x="68" y="60" width="18" height="15" rx="3" fill="#6aa8e0"/>
                    <rect x="68" y="82" width="18" height="15" rx="3" fill="#e0b96a"/>
                    <rect x="68" y="104" width="18" height="15" rx="3" fill="#7fd07f"/>

                    <!-- ================================================
                         والپیپر ویندوز ۱۰
                         ۱) اول فایل محلی win10.jpg (کنار همین HTML)
                         ۲) بعد لینک آنلاین — اگر اینترنت بود، این رو می‌گیره
                         ۳) اگر هیچ‌کدام نبود، دسکتاپ کشیده‌شده‌ی بالا می‌مونه
                         ================================================ -->
                    <image href="win10.jpg" x="52" y="42" width="296" height="170"
                           preserveAspectRatio="xMidYMid slice"
                           clip-path="url(#clipScreen)"
                           pointer-events="none"/>

                    <image href="https://cdn.imgurl.ir/uploads/s029184_Windows_10_Enterprise_m.jpg"
                           x="52" y="42" width="296" height="170"
                           preserveAspectRatio="xMidYMid slice"
                           clip-path="url(#clipScreen)"
                           pointer-events="none"/>

                    <!-- نوار وظیفه -->
                    <rect x="52" y="196" width="296" height="16" fill="#0e1b2a" opacity=".9"/>
                    <circle cx="64" cy="204" r="4" fill="#4ade80"/>
                    <rect x="78" y="201" width="16" height="7" rx="2" fill="#3a5f8a"/>
                    <rect x="100" y="201" width="16" height="7" rx="2" fill="#3a5f8a"/>

                    <rect x="52" y="42" width="296" height="170" rx="6" fill="transparent" pointer-events="all"/>
                </g>

                <!-- چراغ -->
                <g data-part="led" class="part">
                    <circle id="led" cx="276" cy="226" r="4.5"/>
                    <circle cx="276" cy="226" r="18" fill="transparent" pointer-events="all"/>
                </g>

                <!-- دکمه‌های تنظیم -->
                <g data-part="buttons" class="part">
                    <circle cx="200" cy="226" r="7" fill="#2b333f" stroke="#4a5462" stroke-width="1.3"/>
                    <circle cx="218" cy="226" r="7" fill="#2b333f" stroke="#4a5462" stroke-width="1.3"/>
                    <circle cx="236" cy="226" r="7" fill="#2b333f" stroke="#4a5462" stroke-width="1.3"/>
                    <rect x="186" y="208" width="62" height="36" rx="8" fill="transparent" pointer-events="all"/>
                </g>

                <!-- دکمه‌ی پاور -->
                <g data-part="power" class="part">
                    <circle cx="326" cy="226" r="10" fill="#2b333f" stroke="#4a5462" stroke-width="1.5"/>
                    <path d="M326 220.5 L326 226" stroke="#8b97a8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <path d="M321.6 222.6 A5.6 5.6 0 1 0 330.4 222.6" fill="none" stroke="#8b97a8" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="326" cy="226" r="23" fill="transparent" pointer-events="all"/>
                </g>

            </g>

            <!-- ============================================
                 نمای پشت
                 ============================================ -->
            <g id="viewBack">

                <!-- بدنه از پشت -->
                <rect x="40" y="30" width="320" height="210" rx="13" fill="url(#gBack)" stroke="#0a0e14" stroke-width="2"/>
                <rect x="110" y="58" width="180" height="152" rx="10" fill="#232a35" stroke="#161c24" stroke-width="1.4"/>

                <!-- پایه (بدون قطعه) -->
                <rect x="185" y="240" width="30" height="42" fill="url(#gStand)"/>
                <rect x="130" y="280" width="140" height="15" rx="7.5" fill="url(#gStand)" stroke="#0a0e14" stroke-width="1.2"/>

                <!-- سوکت برق -->
                <g data-part="powerport" class="part">
                    <rect x="136" y="178" width="42" height="24" rx="4" fill="#10151c" stroke="#3d4655" stroke-width="1.4"/>
                    <rect x="143" y="185" width="5" height="10" rx="2" fill="#556273"/>
                    <rect x="152" y="185" width="5" height="10" rx="2" fill="#556273"/>
                    <rect x="161" y="185" width="5" height="10" rx="2" fill="#556273"/>
                    <rect x="126" y="168" width="62" height="44" rx="6" fill="transparent" pointer-events="all"/>
                </g>

                <!-- پورت تصویر -->
                <g data-part="videoport" class="part">
                    <rect x="196" y="182" width="34" height="17" rx="3" fill="#10151c" stroke="#3d4655" stroke-width="1.4"/>
                    <rect x="201" y="187" width="24" height="7" rx="2" fill="#556273"/>

                </g>

                <text x="240" y="150" text-anchor="middle" font-size="15" font-family="Tahoma" fill="#7c8798" opacity=".65">پشت مانیتور</text>

            </g>

            <!-- حلقه‌ی نشانگر -->
            <ellipse id="spotRing" cx="0" cy="0" rx="0" ry="0"
                     fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="10 8"
                     stroke-linecap="round"/>

            <!-- دست راهنما -->
            <g id="hintHand">
                <g id="hintBounce">
                    <circle cx="0" cy="-16" r="13" fill="none" stroke="#4ade80" stroke-width="2.6" opacity=".5"/>
                    <circle cx="0" cy="-16" r="4" fill="#4ade80" opacity=".85"/>
                    <path d="M0 -3 L0 15" stroke="#4ade80" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M-8.5 6.5 L0 17 L8.5 6.5" fill="none" stroke="#4ade80"
                          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>

        </svg>
    </div>

    <div id="panel">
        <div id="panelInner">
            <div id="title"></div>
            <div id="text"></div>
            <div id="actions"></div>
        </div>
    </div>

</div>

<div id="burst"></div>

<script>
/* ============================================================
   ۱) محتوای درس‌ها
   ============================================================ */

var PARTS = {
    screen:    ['صفحه',           'همه‌ی کارها اینجا دیده می‌شه. مثل صورت.'],
    stand:     ['پایه',           'مانیتور رو نگه می‌داره که نیفته.'],
    power:     ['دکمه‌ی پاور',     'مانیتور خودش یه دکمه‌ی پاور داره، جدا از کیس.'],
    led:       ['چراغ',           'وقتی مانیتور روشنه، این چراغ سبز می‌شه.'],
    buttons:   ['دکمه‌های تنظیم',  'با اینا روشنایی صفحه رو کم و زیاد می‌کنی.'],
    powerport: ['سوکت برق',       'کابل برق اینجا وصل می‌شه.'],
    videoport: ['سوکت تصویر',     'کابل تصویر اینجا وصل می‌شه و از کیس میاد.']
};

/* محل حلقه‌ی نشانگر: [cx, cy, rx, ry] */
var RING_POS = {
    screen:    [200, 125, 158, 100],
    stand:     [200, 264, 80, 34],
    power:     [326, 226, 30, 30],
    led:       [276, 226, 24, 24],
    buttons:   [218, 226, 42, 26],
    powerport: [157, 190, 36, 28],
    videoport: [213, 190, 34, 28]
};

/* محل دست راهنما */
var HINT_POS = {
    screen:    [200, 16],
    stand:     [200, 236],
    power:     [326, 196],
    led:       [276, 198],
    buttons:   [218, 198],
    powerport: [157, 158],
    videoport: [213, 158]
};

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'screen'  },
    { t:'teach', part:'stand'   },
    { t:'teach', part:'power'   },
    { t:'teach', part:'led'     },
    { t:'teach', part:'buttons' },

    { t:'find',  part:'screen',  ask:'صفحه رو پیدا کن'          },
    { t:'find',  part:'stand',   ask:'پایه رو پیدا کن'           },
    { t:'find',  part:'power',   ask:'دکمه‌ی پاور رو پیدا کن'    },
    { t:'find',  part:'buttons', ask:'دکمه‌های تنظیم رو پیدا کن'  },

    { t:'name',  part:'power'   },
    { t:'name',  part:'led'     },
    { t:'name',  part:'buttons' },

    { t:'teach', part:'powerport', flip:true },
    { t:'teach', part:'videoport', flip:true },

    { t:'find',  part:'powerport', flip:true, ask:'سوکت برق رو پیدا کن'   },
    { t:'find',  part:'videoport', flip:true, ask:'سوکت تصویر رو پیدا کن' },

    { t:'chain', parts:['screen','power','buttons','led'] }
];

/* ============================================================
   ۲) موتور برنامه
   ============================================================ */

var scene    = document.getElementById('scene');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var homeEl   = document.getElementById('home');
var replayEl = document.getElementById('replay');
var titleEl  = document.getElementById('title');
var textEl   = document.getElementById('text');
var actEl    = document.getElementById('actions');
var burstEl  = document.getElementById('burst');
var panelIn  = document.getElementById('panelInner');
var handEl   = document.getElementById('hintHand');
var ringEl   = document.getElementById('spotRing');

var i = 0;
var chainIdx = 0;
var wrongCount = 0;
var lock = false;
var mode = 'menu';

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function partEl(name){
    return scene.querySelector('[data-part="' + name + '"]');
}

function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function clearMarks(){
    var all = scene.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
    ringEl.classList.remove('show');
}

function showRing(part){
    var r = RING_POS[part];
    if(!r) return;
    ringEl.setAttribute('cx', r[0]);
    ringEl.setAttribute('cy', r[1]);
    ringEl.setAttribute('rx', r[2]);
    ringEl.setAttribute('ry', r[3]);
    ringEl.classList.add('show');
}

function showHand(part){
    var p = HINT_POS[part];
    if(!p) return;
    handEl.setAttribute('transform','translate(' + p[0] + ',' + p[1] + ')');
    handEl.classList.add('show');
}

function showBurst(){
    burstEl.innerHTML =
        '<div class="ring"></div>' +
        '<svg class="ok" viewBox="0 0 64 64">' +
        '<path d="M13 33 L26 46 L51 18"/></svg>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<16;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28">' +
                          '<path d="M12 2.2l2.95 6.05 6.65.95-4.8 4.7 1.15 6.65L12 17.4l-5.95 3.15L7.2 13.9 2.4 9.2l6.65-.95z" ' +
                          'fill="#ffd257"/></svg>';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (28 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            if(item.html){ b.innerHTML = item.html; }
            else { b.textContent = item.label; }
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ---------------- نوار بالا و حالت‌ها ---------------- */

function setTop(progress, home, replay){
    countEl.style.display  = progress ? '' : 'none';
    dotsEl.style.display   = progress ? '' : 'none';
    homeEl.style.display   = home ? '' : 'none';
    replayEl.style.display = replay ? '' : 'none';
}

function showMenu(){
    mode = 'menu';
    render();
}

function startLesson(){
    mode = 'lesson';
    i = 0;
    render();
}

/* ---------------- صفحه‌ی منو ---------------- */

function renderMenu(){
    scene.style.display = '';
    scene.classList.remove('on');
    clearMarks();
    replayAnim();
    setTop(false, false, false);
    titleEl.textContent = 'جلسه‌ی ۳ — مانیتور';
    textEl.textContent  = 'کدوم قسمت رو می‌خوای ببینی؟';
    setButtons([
        {
            html: 'شروع درس<small>صفحه • پایه • پاور • چراغ • تنظیم • کابل‌ها</small>',
            cls: 'big main',
            onClick: startLesson
        }
    ]);
}

/* ---------------- نمایش مرحله ---------------- */

function render(){
    if(mode === 'menu'){ renderMenu(); return; }

    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    chainIdx = 0;
    clearMarks();
    replayAnim();

    scene.style.display = '';
    setTop(true, true, true);

    if(s.flip){ scene.classList.add('flip'); }
    else { scene.classList.remove('flip'); }

    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        titleEl.textContent = 'مانیتور رو بشناسیم';
        textEl.textContent  = 'مانیتور صورتِ کامپیوتره. کار اصلی توی کیسه، ولی نتیجه اینجا دیده می‌شه.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی قطعه ---------- */
    if(s.t === 'teach'){
        var p = PARTS[s.part];
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = p[0];
        textEl.textContent  = p[1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- این چیه؟ ---------- */
    if(s.t === 'name'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = 'این چیه؟';
        textEl.textContent  = 'روی جواب درست بزن.';

        var others = [];
        for(var key in PARTS){
            if(key !== s.part){ others.push(key); }
        }
        others.sort(function(){ return Math.random() - 0.5; });

        var choices = [s.part, others[0], others[1]];
        choices.sort(function(){ return Math.random() - 0.5; });

        var list = [];
        for(var c=0;c<choices.length;c++){
            (function(name){
                list.push({
                    label: PARTS[name][0],
                    onClick: function(){
                        if(name === s.part){ correct(partEl(name)); }
                        else { wrongAnswer(); }
                    }
                });
            })(choices[c]);
        }
        setButtons(list);
        return;
    }

    /* ---------- زنجیره‌ی پایانی ---------- */
    if(s.t === 'chain'){
        renderChain();
        return;
    }
}

function renderChain(){
    var s = LESSON[i];
    var want = s.parts[chainIdx];
    clearMarks();
    titleEl.textContent = 'نشونم بده';
    textEl.textContent  = PARTS[want][0] + ' رو پیدا کن   (' +
                          fa(chainIdx + 1) + ' از ' + fa(s.parts.length) + ')';
    setButtons([]);
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

/* ---------------- بازخورد ---------------- */

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();

    setTimeout(function(){
        var s = LESSON[i];

        if(s.t === 'chain'){
            if(chainIdx < s.parts.length - 1){
                chainIdx++;
                lock = false;
                renderChain();
            } else {
                stars();
                titleEl.textContent = 'آفرین!';
                textEl.textContent  = 'همه‌ی قسمتای مانیتور رو شناختی.';
                setButtons([{ label:'برگشت به منو', cls:'main', onClick: showMenu }]);
            }
            return;
        }

        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';

    var s = LESSON[i];
    var want = s.t === 'chain' ? s.parts[chainIdx] : s.part;

    if(wrongCount >= 2 && want){
        partEl(want).classList.add('hint');
        showHand(want);
        if(s.t !== 'chain'){ showRing(want); }
    }
}

/* ---------------- کلیک روی صحنه ---------------- */

scene.addEventListener('click', function(e){
    if(mode !== 'lesson' || lock || suppressClick) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        if(tapped === s.part){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'chain'){
        if(tapped === s.parts[chainIdx]){ correct(g); } else { wrongAnswer(); }
    }
});

/* ---------------- دکمه‌ها ---------------- */

replayEl.onclick = function(){
    vibrate(20);
    render();
};

homeEl.onclick = function(){
    vibrate(20);
    showMenu();
};

/* ---------------- چرخش ملایم صحنه ---------------- */

var stageEl = document.getElementById('stage');
var dragX = 0, dragY = 0, dragging = false, moved = false, suppressClick = false;

stageEl.addEventListener('pointerdown', function(e){
    dragging = true;
    moved = false;
    dragX = e.clientX;
    dragY = e.clientY;
});

stageEl.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dragX;
    var dy = e.clientY - dragY;
    if(Math.abs(dx) + Math.abs(dy) > 10){ moved = true; }
    if(!moved) return;

    var ry = Math.max(-16, Math.min(16, dx * 0.16));
    var rx = Math.max(-12, Math.min(12, -dy * 0.12));
    scene.style.setProperty('--ry', ry + 'deg');
    scene.style.setProperty('--rx', rx + 'deg');
});

function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(moved){
        scene.style.setProperty('--ry', '0deg');
        scene.style.setProperty('--rx', '0deg');
        suppressClick = true;
        setTimeout(function(){ suppressClick = false; }, 160);
    }
}

stageEl.addEventListener('pointerup', endDrag);
stageEl.addEventListener('pointercancel', endDrag);
stageEl.addEventListener('pointerleave', endDrag);

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ---------------- شروع ---------------- */
render();
</script>

</body>
</html>
