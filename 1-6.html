<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>میانبرهای مهم — سطح ۱ / جلسه ۵ (۲ از ۲)</title>
<style>
/* ============================================================
   سطح ۱ — جلسه ۵ / بخش ۲ : میانبرهای مهم
   Ctrl + C  کپی
   Ctrl + V  چسباندن
   Ctrl + X  برش
   Ctrl + Z  برگرداندن
   Ctrl + S  ذخیره

   تک‌فایل • آفلاین • بدون تصویر بیرونی
   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:4px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .12s ease, background .2s;
}

#replay:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:170px;
    position:relative;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
}

#scene text{ direction:ltr; }

#scene g.part{ transition:opacity .4s ease; }

#scene.focusing g.part{ opacity:.22; }

#scene.focusing g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(74,222,128,.95));
}

#scene g.part.hit{
    filter:drop-shadow(0 0 16px rgba(74,222,128,1));
}

#scene g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.3; }
    50%{ opacity:1; }
}

/* نمایش نتیجه‌ی میانبر */
#demo g{ opacity:0; transition:opacity .45s ease; }

#scene[data-demo="copy"]  #demo g[data-dm="copy"]  { opacity:1; }
#scene[data-demo="paste"] #demo g[data-dm="paste"] { opacity:1; }
#scene[data-demo="cut"]   #demo g[data-dm="cut"]   { opacity:1; }
#scene[data-demo="undo"]  #demo g[data-dm="undo"]  { opacity:1; }
#scene[data-demo="save"]  #demo g[data-dm="save"]  { opacity:1; }

#spotRing{
    opacity:0;
    transition:opacity .3s ease;
}

#spotRing.show{
    opacity:1;
    animation:ringPulse 1.5s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{ stroke-width:2.5; opacity:.55; }
    50%{ stroke-width:5; opacity:1; }
}

#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
    max-height:48vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    align-content:flex-start;
}

.btn{
    flex:1;
    min-width:104px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12); }
    50%{ box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22); }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    width:86px;
    height:86px;
    filter:drop-shadow(0 0 20px rgba(74,222,128,.95));
    animation:popOk .85s ease-out forwards;
}

#burst .ok path{
    fill:none;
    stroke:#4ade80;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:72;
    stroke-dashoffset:72;
    animation:drawCheck .5s ease forwards .05s;
}

@keyframes drawCheck{
    to{ stroke-dashoffset:0; }
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

.star{
    position:fixed;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="replay" title="دوباره" aria-label="دوباره">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.7-6"/>
                <path d="M20.5 3.5V9H15"/>
            </svg>
        </button>
    </div>

    <div id="stage">
        <svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#3d4655"/>
                    <stop offset="1" stop-color="#242b36"/>
                </linearGradient>
            </defs>

            <!-- ============================
                 نمایش نتیجه‌ی میانبر
                 ============================ -->
            <g id="demo">

                <g data-dm="copy">
                    <rect x="182" y="16" width="38" height="48" rx="5" fill="#8ea0b5"/>
                    <rect x="170" y="24" width="38" height="48" rx="5" fill="#eef3f9" stroke="#c6d0dc" stroke-width="1.5"/>
                    <rect x="178" y="34" width="22" height="4" rx="2" fill="#c6d0dc"/>
                    <rect x="178" y="44" width="16" height="4" rx="2" fill="#c6d0dc"/>
                </g>

                <g data-dm="paste">
                    <rect x="172" y="18" width="46" height="56" rx="6" fill="#eef3f9" stroke="#c6d0dc" stroke-width="1.5"/>
                    <rect x="186" y="11" width="18" height="10" rx="3" fill="#8ea0b5"/>
                    <path d="M195 34 L195 56 M187 48 L195 57 L203 48" fill="none"
                          stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <g data-dm="cut">
                    <rect x="166" y="20" width="42" height="52" rx="6" fill="#eef3f9" stroke="#c6d0dc" stroke-width="1.5"/>
                    <path d="M174 34 L200 34 M174 44 L194 44" stroke="#c6d0dc" stroke-width="3" stroke-linecap="round"/>
                    <path d="M214 46 L242 46 M234 37 L243 46 L234 55" fill="none"
                          stroke="#ffb454" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <g data-dm="undo">
                    <path d="M236 62 C236 32 204 22 180 36" fill="none"
                          stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
                    <path d="M180 36 L195 31 M180 36 L189 49" fill="none"
                          stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

                <g data-dm="save">
                    <rect x="164" y="20" width="46" height="52" rx="6" fill="#eef3f9" stroke="#c6d0dc" stroke-width="1.5"/>
                    <rect x="174" y="28" width="26" height="14" rx="2" fill="#c6d0dc"/>
                    <path d="M220 44 L230 56 L250 32" fill="none"
                          stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>

            </g>

            <!-- کارت‌های میانبر — با جاوااسکریپت ساخته می‌شوند -->
            <g id="cards"></g>

            <ellipse id="spotRing" cx="0" cy="0" rx="0" ry="0"
                     fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="10 8"
                     stroke-linecap="round"/>

            <g id="hintHand">
                <g id="hintBounce">
                    <circle cx="0" cy="-16" r="13" fill="none" stroke="#4ade80" stroke-width="2.6" opacity=".5"/>
                    <circle cx="0" cy="-16" r="4" fill="#4ade80" opacity=".85"/>
                    <path d="M0 -3 L0 15" stroke="#4ade80" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M-8.5 6.5 L0 17 L8.5 6.5" fill="none" stroke="#4ade80"
                          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>
        </svg>
    </div>

    <div id="panel">
        <div id="panelInner">
            <div id="title"></div>
            <div id="text"></div>
            <div id="actions"></div>
        </div>
    </div>

</div>

<div id="burst"></div>

<script>
/* ============================================================
   ۱) محتوای درس‌ها
   ============================================================ */

var PARTS = {
    copy:  ['کپی',       'Ctrl + C — هر چیزی رو انتخاب کردی، کپی می‌کنه.'],
    paste: ['چسباندن',   'Ctrl + V — اون چیزی که کپی کردی رو اینجا می‌چسبونه.'],
    cut:   ['برش',       'Ctrl + X — مثل کپیه، ولی اصلش رو هم برمی‌داره.'],
    undo:  ['برگرداندن', 'Ctrl + Z — اشتباه کردی؟ این همه‌چیز رو برمی‌گردونه.'],
    save:  ['ذخیره',     'Ctrl + S — کارت رو نگه می‌داره. هر چند دقیقه بزنش.']
};

/* کارت‌ها — مثل چیدمان واقعی کیبورد:
   Z X C V روی ردیف پایین، S روی ردیف وسط */
var CARDS = [
    { id:'undo',  letter:'Z', x:9,   y:180 },
    { id:'cut',   letter:'X', x:107, y:180 },
    { id:'copy',  letter:'C', x:205, y:180 },
    { id:'paste', letter:'V', x:303, y:180 },
    { id:'save',  letter:'S', x:107, y:96  }
];

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'copy'  },
    { t:'teach', part:'paste' },
    { t:'teach', part:'cut'   },
    { t:'teach', part:'undo'  },
    { t:'teach', part:'save'  },

    { t:'find',  part:'copy',  ask:'میانبر کپی کدومه؟'        },
    { t:'find',  part:'paste', ask:'میانبر چسباندن کدومه؟'    },
    { t:'find',  part:'cut',   ask:'میانبر برش کدومه؟'        },
    { t:'find',  part:'undo',  ask:'میانبر برگرداندن کدومه؟'  },
    { t:'find',  part:'save',  ask:'میانبر ذخیره کدومه؟'      },

    { t:'name',  part:'copy'  },
    { t:'name',  part:'undo'  },
    { t:'name',  part:'save'  },
    { t:'name',  part:'cut'   },

    { t:'chain', parts:['copy','paste','undo','save','cut'] }
];

/* ============================================================
   ۲) ساخت کارت‌ها
   ============================================================ */

function cardSvg(c){
    var cx = c.x + 44;
    var s = '';
    s += '<g data-part="' + c.id + '" class="part">';
    s += '<rect x="' + c.x + '" y="' + c.y + '" width="88" height="72" rx="13" ' +
         'fill="url(#gCard)" stroke="#4a5462" stroke-width="1.6"/>';
    s += '<text x="' + cx + '" y="' + (c.y + 29) + '" text-anchor="middle" font-size="14" ' +
         'font-family="Tahoma" fill="#8b97a8">Ctrl +</text>';
    s += '<text x="' + cx + '" y="' + (c.y + 61) + '" text-anchor="middle" font-size="30" ' +
         'font-weight="bold" font-family="Tahoma" fill="#e8edf5">' + c.letter + '</text>';
    s += '<rect x="' + (c.x - 4) + '" y="' + (c.y - 4) + '" width="96" height="80" rx="16" ' +
         'fill="transparent" pointer-events="all"/>';
    s += '</g>';
    return s;
}

function buildCards(){
    var out = '';
    for(var k=0;k<CARDS.length;k++){
        out += cardSvg(CARDS[k]);
    }
    document.getElementById('cards').innerHTML = out;
}

/* ============================================================
   ۳) موتور برنامه
   ============================================================ */

var scene    = document.getElementById('scene');
var cards    = document.getElementById('cards');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var replayEl = document.getElementById('replay');
var titleEl  = document.getElementById('title');
var textEl   = document.getElementById('text');
var actEl    = document.getElementById('actions');
var burstEl  = document.getElementById('burst');
var panelIn  = document.getElementById('panelInner');
var handEl   = document.getElementById('hintHand');
var ringEl   = document.getElementById('spotRing');

var i = 0;
var chainIdx = 0;
var wrongCount = 0;
var lock = false;

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function partEl(name){
    return cards.querySelector('[data-part="' + name + '"]');
}

function clearMarks(){
    var all = cards.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
    ringEl.classList.remove('show');
}

function showRing(part){
    var el = partEl(part);
    ringEl.setAttribute('cx', 200);
    ringEl.setAttribute('cy', 200);
    ringEl.setAttribute('rx', 0);
    ringEl.setAttribute('ry', 0);
    if(el){
        var b = el.getBBox();
        ringEl.setAttribute('cx', b.x + b.width / 2);
        ringEl.setAttribute('cy', b.y + b.height / 2);
        ringEl.setAttribute('rx', b.width / 2 + 9);
        ringEl.setAttribute('ry', b.height / 2 + 9);
    }
    ringEl.classList.add('show');
}

function showHand(part){
    var el = partEl(part);
    if(!el || !el.getBBox) return;
    var b = el.getBBox();
    handEl.setAttribute('transform','translate(' + (b.x + b.width / 2).toFixed(1) + ',' + (b.y - 8).toFixed(1) + ')');
    handEl.classList.add('show');
}

function showBurst(){
    burstEl.innerHTML =
        '<div class="ring"></div>' +
        '<svg class="ok" viewBox="0 0 64 64">' +
        '<path d="M13 33 L26 46 L51 18"/></svg>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<16;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28">' +
                          '<path d="M12 2.2l2.95 6.05 6.65.95-4.8 4.7 1.15 6.65L12 17.4l-5.95 3.15L7.2 13.9 2.4 9.2l6.65-.95z" ' +
                          'fill="#ffd257"/></svg>';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (28 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            b.textContent = item.label;
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ---------------- نمایش مرحله ---------------- */

function render(){
    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    chainIdx = 0;
    clearMarks();
    replayAnim();
    scene.setAttribute('data-demo','');

    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        titleEl.textContent = 'میانبر چیه؟';
        textEl.textContent  = 'دو تا کلید با هم، کار یه عالمه کلیک رو انجام می‌دن. ' +
                              'حرف‌ها هم تصادفی نیستن: C برای Copy، S برای Save.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی میانبر ---------- */
    if(s.t === 'teach'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        scene.setAttribute('data-demo', s.part);
        showRing(s.part);
        titleEl.textContent = PARTS[s.part][0];
        textEl.textContent  = PARTS[s.part][1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        /* نمایش نتیجه پنهان می‌ماند، وگرنه جواب لو می‌رود */
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- این چیکار می‌کنه؟ ---------- */
    if(s.t === 'name'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        scene.setAttribute('data-demo', s.part);
        showRing(s.part);
        titleEl.textContent = 'این چیکار می‌کنه؟';
        textEl.textContent  = 'روی جواب درست بزن.';

        var others = [];
        for(var key in PARTS){
            if(key !== s.part){ others.push(key); }
        }
        others.sort(function(){ return Math.random() - 0.5; });

        var choices = [s.part, others[0], others[1]];
        choices.sort(function(){ return Math.random() - 0.5; });

        var list = [];
        for(var c=0;c<choices.length;c++){
            (function(name){
                list.push({
                    label: PARTS[name][0],
                    onClick: function(){
                        if(name === s.part){ correct(partEl(name)); }
                        else { wrongAnswer(); }
                    }
                });
            })(choices[c]);
        }
        setButtons(list);
        return;
    }

    /* ---------- زنجیره‌ی پایانی ---------- */
    if(s.t === 'chain'){
        renderChain();
        return;
    }
}

function renderChain(){
    var s = LESSON[i];
    var want = s.parts[chainIdx];
    clearMarks();
    titleEl.textContent = 'نشونم بده';
    textEl.textContent  = PARTS[want][0] + ' کدومه؟   (' +
                          fa(chainIdx + 1) + ' از ' + fa(s.parts.length) + ')';
    setButtons([]);
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();

    setTimeout(function(){
        var s = LESSON[i];

        if(s.t === 'chain'){
            if(chainIdx < s.parts.length - 1){
                chainIdx++;
                lock = false;
                renderChain();
            } else {
                stars();
                titleEl.textContent = 'آفرین!';
                textEl.textContent  = 'پنج میانبر مهم رو یاد گرفتی. حالا روی کیبورد واقعی هم امتحان کن.';
                setButtons([{ label:'از اول', cls:'main', onClick: function(){ i = 0; render(); } }]);
            }
            return;
        }

        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';

    var s = LESSON[i];
    var want = s.t === 'chain' ? s.parts[chainIdx] : s.part;

    if(wrongCount >= 2 && want){
        partEl(want).classList.add('hint');
        showHand(want);
        if(s.t !== 'chain'){ showRing(want); }
    }
}

/* ---------------- کلیک روی کارت‌ها ---------------- */

cards.addEventListener('click', function(e){
    if(lock) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        if(tapped === s.part){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'chain'){
        if(tapped === s.parts[chainIdx]){ correct(g); } else { wrongAnswer(); }
    }
});

replayEl.onclick = function(){
    vibrate(20);
    render();
};

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ---------------- شروع ---------------- */

buildCards();
render();
</script>

</body>
</html>
