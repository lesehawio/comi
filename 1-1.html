<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>اجزای ماوس — سطح ۱ / جلسه ۲</title>
<style>
/* ============================================================
   سطح ۱ — جلسه ۲ : اجزای ماوس
   دکمه‌ی چپ • دکمه‌ی راست • چرخ وسط • سنسور

   تک‌فایل • آفلاین • بدون تصویر بیرونی
   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:5px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay,
#home{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .12s ease, background .2s;
}

#replay:active,
#home:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:170px;
    position:relative;
    perspective:900px;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
    transition:transform .5s cubic-bezier(.2,.8,.3,1);
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
}

#scene g.part{ transition:opacity .4s ease; }

#scene.focusing g.part{ opacity:.2; }

#scene.focusing g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 12px rgba(74,222,128,.95));
}

#scene g.part.hit{
    filter:drop-shadow(0 0 16px rgba(74,222,128,1));
}

#scene g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.32; }
    50%{ opacity:1; }
}

/* حلقه‌ی نشانگر دور قطعه */
#spotRing{
    opacity:0;
    transition:opacity .35s ease;
}

#spotRing.show{
    opacity:1;
    animation:ringPulse 1.5s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{ stroke-width:2.5; opacity:.55; }
    50%{ stroke-width:5; opacity:1; }
}

/* دو نمای ماوس: رو و زیر */
#viewTop,
#viewBottom{
    transition:opacity .5s ease;
}

#viewBottom{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewTop{
    opacity:0;
    pointer-events:none;
}

#scene.flip #viewBottom{
    opacity:1;
    pointer-events:auto;
}

/* دست راهنما */
#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

/* لرزش */
#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
    /* سقف ارتفاع: نگذارد پنل، صحنه‌ی ماوس را له کند */
    max-height:48vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    min-width:118px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

.btn.chip{
    flex:0 0 auto;
    min-width:0;
    min-height:46px;
    font-size:14.5px;
    padding:0 13px;
    border-radius:13px;
}

.btn.big{
    flex:1 0 100%;
    min-height:86px;
    font-size:20px;
    flex-direction:column;
    gap:5px;
    line-height:1.3;
    padding:12px;
}

.btn.big small{
    display:block;
    font-size:13.5px;
    font-weight:normal;
    opacity:.75;
}

#actions{
    align-content:flex-start;
}

#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12); }
    50%{ box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22); }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    width:86px;
    height:86px;
    filter:drop-shadow(0 0 20px rgba(74,222,128,.95));
    animation:popOk .85s ease-out forwards;
}

#burst .ok path{
    fill:none;
    stroke:#4ade80;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:72;
    stroke-dashoffset:72;
    animation:drawCheck .5s ease forwards .05s;
}

@keyframes drawCheck{
    to{ stroke-dashoffset:0; }
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

.star{
    position:fixed;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

/* =========================
   بازی آزاد: ماوس سه‌بعدی
   ========================= */

#mouse3d{
    --m3scale:.58;
    --m3rx:58deg;
    --m3ry:-22deg;
    position:absolute;
    inset:0;
    display:none;
    perspective:1200px;
    perspective-origin:50% 45%;
    overflow:hidden;
    touch-action:none;
}

#mouse3d.show{ display:block; }

.m3-shadow{
    position:absolute;
    width:340px;
    height:150px;
    left:50%;
    top:66%;
    transform:translate(-50%,-50%) rotateX(78deg) translateZ(-70px);
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);
    pointer-events:none;
}

.m3-model{
    position:absolute;
    left:50%;
    top:50%;
    width:330px;
    height:540px;
    transform-style:preserve-3d;
    transform:
        translate(-50%,-50%)
        scale(var(--m3scale))
        rotateX(var(--m3rx))
        rotateY(var(--m3ry));
    transition:transform .07s linear;
    cursor:grab;
}

.m3-body{
    position:absolute;
    left:0;
    top:0;
    width:330px;
    height:540px;
    border-radius:165px 165px 125px 125px;
    background:linear-gradient(110deg,#fafafa 0%,#e9e9e9 42%,#cfcfcf 100%);
    border:1px solid #a9a9a9;
    box-shadow:
        inset 12px 0 22px rgba(255,255,255,.7),
        inset -12px 0 22px rgba(0,0,0,.12),
        0 20px 30px rgba(0,0,0,.22);
    transform-style:preserve-3d;
}

.m3-side{
    position:absolute;
    left:7px;
    top:15px;
    width:316px;
    height:515px;
    border-radius:158px 158px 118px 118px;
    border:2px solid rgba(80,80,80,.22);
    background:linear-gradient(90deg,#bdbdbd,#e1e1e1 28%,#c5c5c5 70%,#a9a9a9);
    transform:translateZ(-18px);
    box-shadow:0 13px 15px rgba(0,0,0,.18);
}

.m3-shell{
    position:absolute;
    left:5px;
    top:5px;
    width:320px;
    height:430px;
    border-radius:160px 160px 95px 95px;
    background:linear-gradient(105deg,#ffffff,#ededed 48%,#d4d4d4);
    border:1px solid rgba(100,100,100,.45);
    transform:translateZ(9px);
    box-shadow:
        inset 7px 5px 15px rgba(255,255,255,.8),
        inset -7px -4px 15px rgba(0,0,0,.08);
}

.m3-btn{
    position:absolute;
    top:15px;
    width:158px;
    height:275px;
    background:linear-gradient(110deg,#ffffff,#eeeeee 60%,#d6d6d6);
    border:1px solid #aaa;
    box-shadow:
        inset 3px 3px 8px rgba(255,255,255,.85),
        inset -4px -5px 10px rgba(0,0,0,.09);
    cursor:pointer;
    transform-style:preserve-3d;
    transform:translateZ(23px);
    transition:transform .07s ease, box-shadow .07s ease;
}

.m3-left{ left:3px; border-radius:150px 15px 8px 45px; }
.m3-right{ right:3px; border-radius:15px 150px 45px 8px; }

.m3-btn.pressed{
    transform:translateZ(12px) translateY(6px);
    box-shadow:inset 3px 4px 9px rgba(0,0,0,.18);
}

.m3-channel{
    position:absolute;
    top:35px;
    left:50%;
    width:43px;
    height:190px;
    transform:translateX(-50%) translateZ(28px);
    border-radius:24px;
    background:linear-gradient(90deg,#bdbdbd,#eeeeee 25%,#d2d2d2 75%,#aaa);
    border:1px solid #999;
    box-shadow:inset 0 3px 7px rgba(255,255,255,.7), inset 0 -4px 8px rgba(0,0,0,.12);
}

.m3-wheel{
    position:absolute;
    left:50%;
    top:67px;
    width:20px;
    height:72px;
    transform:translateX(-50%) translateZ(37px);
    border-radius:12px;
    background:repeating-linear-gradient(to bottom,#555 0px,#555 4px,#777 5px,#777 8px);
    border:2px solid #444;
    box-shadow:0 2px 4px rgba(0,0,0,.35), inset 2px 0 3px rgba(255,255,255,.25);
    cursor:ns-resize;
}

.m3-wheel-hl{
    position:absolute;
    width:4px;
    height:50px;
    left:3px;
    top:7px;
    border-radius:4px;
    background:rgba(255,255,255,.35);
}

.m3-seam{
    position:absolute;
    left:50%;
    top:21px;
    width:2px;
    height:255px;
    transform:translateX(-50%) translateZ(18px);
    background:linear-gradient(to bottom,rgba(80,80,80,.15),rgba(60,60,60,.5),rgba(80,80,80,.08));
    pointer-events:none;
}

.m3-outline{
    position:absolute;
    left:12px;
    top:12px;
    width:306px;
    height:490px;
    border-radius:153px 153px 113px 113px;
    border:1px solid rgba(255,255,255,.55);
    transform:translateZ(15px);
    pointer-events:none;
}

.m3-bottom{
    position:absolute;
    left:12px;
    top:35px;
    width:306px;
    height:485px;
    border-radius:153px 153px 108px 108px;
    background:linear-gradient(115deg,#303030,#191919 50%,#292929);
    border:2px solid #111;
    transform:translateZ(-22px);
    box-shadow:inset 0 0 15px rgba(0,0,0,.7);
}

.m3-sensor{
    position:absolute;
    left:50%;
    bottom:65px;
    width:55px;
    height:35px;
    transform:translateX(-50%) translateZ(-27px);
    border-radius:10px;
    background:#111;
    border:2px solid #555;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.08);
}

.m3-led{
    position:absolute;
    left:50%;
    bottom:78px;
    width:26px;
    height:26px;
    transform:translateX(-50%) translateZ(-28px);
    border-radius:50%;
    background:radial-gradient(circle,#ff3333 0%,#cc0000 45%,#440000 85%,#0a0000 100%);
    box-shadow:0 0 14px 4px rgba(255,40,40,.85), 0 0 30px 10px rgba(255,0,0,.45), inset 0 0 6px rgba(255,255,255,.8);
    animation:m3Led 1.8s ease-in-out infinite;
    pointer-events:none;
}

@keyframes m3Led{
    0%,100%{
        box-shadow:0 0 14px 4px rgba(255,40,40,.85), 0 0 30px 10px rgba(255,0,0,.45), inset 0 0 6px rgba(255,255,255,.8);
    }
    50%{
        box-shadow:0 0 20px 7px rgba(255,60,60,1), 0 0 42px 15px rgba(255,0,0,.65), inset 0 0 10px rgba(255,255,255,1);
    }
}

.m3-foot{
    position:absolute;
    width:70px;
    height:28px;
    border-radius:20px;
    background:#111;
    transform:translateZ(-29px);
}

.m3-f1{ left:45px; bottom:35px; }
.m3-f2{ right:45px; bottom:35px; }
.m3-f3{ left:50%; bottom:22px; transform:translateX(-50%) translateZ(-29px); }

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    .btn.chip{ min-height:46px; font-size:14.5px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
    #mouse3d{ --m3scale:.46; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="home" title="منو" aria-label="منو">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 10.6 12 3.2l9 7.4"/>
                <path d="M6 9.6V20.5h12V9.6"/>
            </svg>
        </button>
        <button id="replay" title="دوباره" aria-label="دوباره">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.7-6"/>
                <path d="M20.5 3.5V9H15"/>
            </svg>
        </button>
    </div>

    <div id="stage">
        <svg id="scene" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#e9eef4"/>
                    <stop offset=".45" stop-color="#cfd7e0"/>
                    <stop offset="1" stop-color="#9aa5b3"/>
                </linearGradient>
                <linearGradient id="gBtnL" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#ffffff"/>
                    <stop offset="1" stop-color="#dfe6ee"/>
                </linearGradient>
                <linearGradient id="gBtnR" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f6f9fc"/>
                    <stop offset="1" stop-color="#d3dbe4"/>
                </linearGradient>
                <linearGradient id="gUnder" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#333b47"/>
                    <stop offset="1" stop-color="#1a1f27"/>
                </linearGradient>
                <radialGradient id="gSensor" cx=".5" cy=".5" r=".5">
                    <stop offset="0" stop-color="#1a2029"/>
                    <stop offset="1" stop-color="#0a0d12"/>
                </radialGradient>
                <radialGradient id="gLed">
                    <stop offset="0" stop-color="#ff6b6b"/>
                    <stop offset=".45" stop-color="#e01f1f"/>
                    <stop offset="1" stop-color="#5a0505"/>
                </radialGradient>
                <filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%">
                    <feGaussianBlur stdDeviation="6"/>
                </filter>
                <filter id="fLed" x="-120%" y="-120%" width="340%" height="340%">
                    <feGaussianBlur stdDeviation="7"/>
                </filter>
                <clipPath id="clipBody">
                    <path d="M55 150 C55 85 95 56 150 56 C205 56 245 85 245 150 L245 280 C245 360 215 404 150 404 C85 404 55 360 55 280 Z"/>
                </clipPath>
                <path id="bodyPath" d="M55 150 C55 85 95 56 150 56 C205 56 245 85 245 150 L245 280 C245 360 215 404 150 404 C85 404 55 360 55 280 Z"/>
            </defs>

            <!-- سایه زیر ماوس -->
            <ellipse cx="150" cy="404" rx="105" ry="14" fill="#000" opacity=".5" filter="url(#fSoft)"/>

            <!-- ============================================
                 نمای رو
                 ============================================ -->
            <g id="viewTop">
                <!-- کابل -->
                <path d="M150 58 C150 40 148 24 150 8" fill="none" stroke="#2a313c" stroke-width="7" stroke-linecap="round"/>
                <path d="M150 58 C150 40 148 24 150 8" fill="none" stroke="#444d5b" stroke-width="3" stroke-linecap="round"/>

                <!-- بدنه -->
                <path d="M55 150 C55 85 95 56 150 56 C205 56 245 85 245 150 L245 280 C245 360 215 404 150 404 C85 404 55 360 55 280 Z"
                      fill="url(#gBody)" stroke="#0a0e14" stroke-width="2"/>

                <!-- دکمه چپ و راست -->
                <g clip-path="url(#clipBody)">
                    <rect data-part="left"  x="30"  y="30" width="120" height="200" fill="url(#gBtnL)"/>
                    <rect data-part="right" x="150" y="30" width="120" height="200" fill="url(#gBtnR)"/>
                </g>

                <!-- خط جداکننده دکمه‌ها -->
                <line x1="150" y1="60" x2="150" y2="226" stroke="#9aa5b3" stroke-width="1.6" opacity=".85"/>
                <path d="M56 226 L244 226" stroke="#9aa5b3" stroke-width="1.6" opacity=".7" fill="none"/>

                <!-- انعکاس روی بدنه -->
                <path d="M70 130 C70 88 100 68 150 68" fill="none" stroke="#ffffff" stroke-width="4" opacity=".55" stroke-linecap="round"/>
                <path d="M62 300 C66 350 92 384 150 388" fill="none" stroke="#ffffff" stroke-width="3" opacity=".3" stroke-linecap="round"/>

                <!-- چرخ وسط -->
                <g data-part="wheel">
                    <rect x="139" y="120" width="22" height="54" rx="11" fill="#2b333f" stroke="#0a0e14" stroke-width="1.6"/>
                    <rect x="143" y="126" width="14" height="42" rx="7" fill="#4a5566"/>
                    <line x1="145" y1="134" x2="155" y2="134" stroke="#6b7889" stroke-width="1.6"/>
                    <line x1="145" y1="143" x2="155" y2="143" stroke="#6b7889" stroke-width="1.6"/>
                    <line x1="145" y1="152" x2="155" y2="152" stroke="#6b7889" stroke-width="1.6"/>
                    <line x1="145" y1="161" x2="155" y2="161" stroke="#6b7889" stroke-width="1.6"/>
                    <rect x="128" y="108" width="48" height="78" rx="18" fill="transparent" pointer-events="all"/>
                </g>

                <!-- برچسب چپ/راست برای خوانایی -->
                <text x="103" y="250" text-anchor="middle" font-size="17" font-family="Tahoma" fill="#7c8798" opacity=".75">چپ</text>
                <text x="197" y="250" text-anchor="middle" font-size="17" font-family="Tahoma" fill="#7c8798" opacity=".75">راست</text>
            </g>

            <!-- ============================================
                 نمای زیر
                 ============================================ -->
            <g id="viewBottom">
                <use href="#bodyPath" fill="url(#gUnder)" stroke="#0a0e14" stroke-width="2"/>

                <!-- پایه‌ها -->
                <rect x="72" y="352" width="46" height="15" rx="7" fill="#0e1219"/>
                <rect x="182" y="352" width="46" height="15" rx="7" fill="#0e1219"/>
                <rect x="128" y="386" width="44" height="14" rx="7" fill="#0e1219"/>

                <!-- سنسور -->
                <g data-part="sensor">
                    <circle cx="150" cy="265" r="46" fill="#10151c" stroke="#2b333f" stroke-width="2"/>
                    <circle cx="150" cy="265" r="30" fill="url(#gSensor)" stroke="#2b333f" stroke-width="1.5"/>
                    <circle cx="150" cy="265" r="22" fill="#ff2d2d" opacity=".55" filter="url(#fLed)"/>
                    <circle cx="150" cy="265" r="13" fill="url(#gLed)"/>
                    <circle cx="145" cy="260" r="4" fill="#ffd0d0" opacity=".85"/>
                    <circle cx="150" cy="265" r="70" fill="transparent" pointer-events="all"/>
                </g>

                <text x="150" y="180" text-anchor="middle" font-size="15" font-family="Tahoma" fill="#7c8798" opacity=".7">زیر ماوس</text>
            </g>

            <!-- حلقه‌ی نشانگر -->
            <ellipse id="spotRing" cx="0" cy="0" rx="0" ry="0"
                     fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="10 8"
                     stroke-linecap="round"/>

            <!-- دست راهنما -->
            <g id="hintHand">
                <g id="hintBounce">
                    <circle cx="0" cy="-16" r="13" fill="none" stroke="#4ade80" stroke-width="2.6" opacity=".5"/>
                    <circle cx="0" cy="-16" r="4" fill="#4ade80" opacity=".85"/>
                    <path d="M0 -3 L0 15" stroke="#4ade80" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M-8.5 6.5 L0 17 L8.5 6.5" fill="none" stroke="#4ade80"
                          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>

        </svg>

        <!-- ============================================================
             بازی آزاد — ماوس سه‌بعدی (مرحله‌ی آخر)
             ============================================================ -->
        <div id="mouse3d">
            <div class="m3-shadow"></div>
            <div class="m3-model">
                <div class="m3-bottom">
                    <div class="m3-sensor"></div>
                    <div class="m3-led"></div>
                    <div class="m3-foot m3-f1"></div>
                    <div class="m3-foot m3-f2"></div>
                    <div class="m3-foot m3-f3"></div>
                </div>
                <div class="m3-body">
                    <div class="m3-side"></div>
                    <div class="m3-shell"></div>
                    <div class="m3-btn m3-left"></div>
                    <div class="m3-btn m3-right"></div>
                    <div class="m3-channel"></div>
                    <div class="m3-wheel"><div class="m3-wheel-hl"></div></div>
                    <div class="m3-seam"></div>
                    <div class="m3-outline"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="panel">
        <div id="panelInner">
            <div id="title"></div>
            <div id="text"></div>
            <div id="actions"></div>
        </div>
    </div>

</div>

<div id="burst"></div>

<script>
/* ============================================================
   ۱) محتوای درس‌ها
   ============================================================ */

var PARTS = {
    left:   ['دکمه‌ی چپ',   'بیشتر کارا با این انجام می‌شه. با انگشت اشاره بزنش.'],
    right:  ['دکمه‌ی راست', 'با این یه منو باز می‌شه. با انگشت وسط بزنش.'],
    wheel:  ['چرخ وسط',     'باهاش صفحه رو می‌بری بالا و پایین.'],
    sensor: ['سنسور',       'زیر ماوسه. با این می‌فهمه کجا می‌ری.']
};

/* محل حلقه‌ی نشانگر: [cx, cy, rx, ry] */
var RING_POS = {
    left:   [103, 145, 54, 106],
    right:  [197, 145, 54, 106],
    wheel:  [150, 147, 34, 50],
    sensor: [150, 265, 66, 66]
};

/* محل دست راهنما */
var HINT_POS = {
    left:   [103, 118],
    right:  [197, 118],
    wheel:  [150, 100],
    sensor: [150, 202]
};

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'left'  },
    { t:'teach', part:'right' },
    { t:'teach', part:'wheel' },

    { t:'find',  part:'left',  ask:'دکمه‌ی چپ رو پیدا کن'  },
    { t:'find',  part:'right', ask:'دکمه‌ی راست رو پیدا کن' },
    { t:'find',  part:'wheel', ask:'چرخ وسط رو پیدا کن'    },

    { t:'name',  part:'left'  },
    { t:'name',  part:'right' },
    { t:'name',  part:'wheel' },

    { t:'teach', part:'sensor', flip:true },
    { t:'find',  part:'sensor', flip:true, ask:'سنسور رو پیدا کن' },

    { t:'chain', parts:['left','wheel','right'] }
];

/* ============================================================
   ۲) موتور برنامه
   ============================================================ */

var scene    = document.getElementById('scene');
var m3El     = document.getElementById('mouse3d');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var homeEl   = document.getElementById('home');
var replayEl = document.getElementById('replay');
var titleEl = document.getElementById('title');
var textEl  = document.getElementById('text');
var actEl   = document.getElementById('actions');
var burstEl = document.getElementById('burst');
var panelIn = document.getElementById('panelInner');
var handEl  = document.getElementById('hintHand');
var ringEl  = document.getElementById('spotRing');

var i = 0;
var chainIdx = 0;
var wrongCount = 0;
var lock = false;

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function partEl(name){
    return scene.querySelector('[data-part="' + name + '"]');
}

function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function clearMarks(){
    var all = scene.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
    ringEl.classList.remove('show');
}

function showRing(part){
    var r = RING_POS[part];
    if(!r) return;
    ringEl.setAttribute('cx', r[0]);
    ringEl.setAttribute('cy', r[1]);
    ringEl.setAttribute('rx', r[2]);
    ringEl.setAttribute('ry', r[3]);
    ringEl.classList.add('show');
}

function showHand(part){
    var p = HINT_POS[part];
    if(!p) return;
    handEl.setAttribute('transform','translate(' + p[0] + ',' + p[1] + ')');
    handEl.classList.add('show');
}

function showBurst(){
    burstEl.innerHTML =
        '<div class="ring"></div>' +
        '<svg class="ok" viewBox="0 0 64 64">' +
        '<path d="M13 33 L26 46 L51 18"/></svg>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<16;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28">' +
                          '<path d="M12 2.2l2.95 6.05 6.65.95-4.8 4.7 1.15 6.65L12 17.4l-5.95 3.15L7.2 13.9 2.4 9.2l6.65-.95z" ' +
                          'fill="#ffd257"/></svg>';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (28 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            if(item.html){ b.innerHTML = item.html; }
            else { b.textContent = item.label; }
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ============================================================
   حالت‌های برنامه: منو / درس / ماوس سه‌بعدی
   ============================================================ */

var mode = 'menu';

function setTop(progress, home, replay){
    countEl.style.display  = progress ? '' : 'none';
    dotsEl.style.display   = progress ? '' : 'none';
    homeEl.style.display   = home ? '' : 'none';
    replayEl.style.display = replay ? '' : 'none';
}

function showMenu(){
    mode = 'menu';
    render();
}

function startLesson(){
    mode = 'lesson';
    i = 0;
    render();
}

function showMouse3D(){
    mode = 'mouse3d';
    render();
}

/* ---------------- صفحه‌ی منو ---------------- */

function renderMenu(){
    scene.style.display = '';
    m3El.classList.remove('show');
    clearMarks();
    replayAnim();
    setTop(false, false, false);
    titleEl.textContent = 'جلسه‌ی ۲ — ماوس';
    textEl.textContent  = 'کدوم قسمت رو می‌خوای ببینی؟';
    setButtons([
        {
            html: 'شروع درس<small>دکمه‌ی چپ • راست • چرخ • سنسور</small>',
            cls: 'big main',
            onClick: startLesson
        },
        {
            html: 'ماوس سه‌بعدی<small>بچرخونش و از همه طرف ببینش</small>',
            cls: 'big',
            onClick: showMouse3D
        }
    ]);
}

/* ---------------- بازی آزاد سه‌بعدی ---------------- */

function renderMouse3D(){
    scene.style.display = 'none';
    m3El.classList.add('show');
    clearMarks();
    replayAnim();
    setTop(false, true, false);
    titleEl.textContent = 'ماوس سه‌بعدی';
    textEl.textContent  = 'با انگشت بچرخونش. دکمه‌هاش رو هم بزن.';
    setButtons([{ label:'برگشت به منو', cls:'main', onClick: showMenu }]);
}

/* ---------------- نمایش مرحله ---------------- */

function render(){
    if(mode === 'menu'){ renderMenu(); return; }
    if(mode === 'mouse3d'){ renderMouse3D(); return; }

    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    chainIdx = 0;
    clearMarks();
    replayAnim();

    scene.style.display = '';
    m3El.classList.remove('show');
    setTop(true, true, true);

    if(s.flip){ scene.classList.add('flip'); }
    else { scene.classList.remove('flip'); }

    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        titleEl.textContent = 'ماوس رو بشناسیم';
        textEl.textContent  = 'ماوس دستِ کامپیوتره. بریم ببینیم از چی ساخته شده.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی قطعه ---------- */
    if(s.t === 'teach'){
        var p = PARTS[s.part];
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = p[0];
        textEl.textContent  = p[1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- این چیه؟ ---------- */
    if(s.t === 'name'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        showRing(s.part);
        titleEl.textContent = 'این چیه؟';
        textEl.textContent  = 'روی جواب درست بزن.';

        var others = [];
        for(var key in PARTS){
            if(key !== s.part){ others.push(key); }
        }
        others.sort(function(){ return Math.random() - 0.5; });

        var choices = [s.part, others[0], others[1]];
        choices.sort(function(){ return Math.random() - 0.5; });

        var list = [];
        for(var c=0;c<choices.length;c++){
            (function(name){
                list.push({
                    label: PARTS[name][0],
                    onClick: function(){
                        if(name === s.part){ correct(partEl(name)); }
                        else { wrongAnswer(); }
                    }
                });
            })(choices[c]);
        }
        setButtons(list);
        return;
    }

    /* ---------- زنجیره‌ی پایانی ---------- */
    if(s.t === 'chain'){
        renderChain();
        return;
    }
}

function renderChain(){
    var s = LESSON[i];
    var want = s.parts[chainIdx];
    clearMarks();
    titleEl.textContent = 'نشونم بده';
    textEl.textContent  = PARTS[want][0] + ' رو پیدا کن   (' +
                          fa(chainIdx + 1) + ' از ' + fa(s.parts.length) + ')';
    setButtons([]);
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

/* ---------------- بازخورد ---------------- */

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();

    setTimeout(function(){
        var s = LESSON[i];

        if(s.t === 'chain'){
            if(chainIdx < s.parts.length - 1){
                chainIdx++;
                lock = false;
                renderChain();
            } else {
                stars();
                titleEl.textContent = 'آفرین!';
                textEl.textContent  = 'همه‌ی قسمتای ماوس رو شناختی.';
                setButtons([{ label:'برگشت به منو', cls:'main', onClick: showMenu }]);
            }
            return;
        }

        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';

    var s = LESSON[i];
    var want = s.t === 'chain' ? s.parts[chainIdx] : s.part;

    if(wrongCount >= 2 && want){
        partEl(want).classList.add('hint');
        showHand(want);
        if(s.t !== 'chain'){ showRing(want); }
    }
}

/* ---------------- کلیک روی صحنه ---------------- */

scene.addEventListener('click', function(e){
    /* در منو و بازی سه‌بعدی، لمس صحنه شمرده نمی‌شود */
    if(mode !== 'lesson' || lock || suppressClick) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        if(tapped === s.part){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'chain'){
        if(tapped === s.parts[chainIdx]){ correct(g); } else { wrongAnswer(); }
    }
});

/* ---------------- دکمه‌ها ---------------- */

replayEl.onclick = function(){
    vibrate(20);
    render();
};

homeEl.onclick = function(){
    vibrate(20);
    showMenu();
};

/* ---------------- چرخش ملایم سه‌بعدی با کشیدن ---------------- */

var stageEl = document.getElementById('stage');
var dragX = 0, dragY = 0, dragging = false, moved = false, suppressClick = false;

stageEl.addEventListener('pointerdown', function(e){
    if(m3El.classList.contains('show')) return;
    dragging = true;
    moved = false;
    dragX = e.clientX;
    dragY = e.clientY;
});

stageEl.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dragX;
    var dy = e.clientY - dragY;
    if(Math.abs(dx) + Math.abs(dy) > 10){ moved = true; }
    if(!moved) return;

    var ry = Math.max(-18, Math.min(18, dx * 0.18));
    var rx = Math.max(-14, Math.min(14, -dy * 0.14));
    scene.style.setProperty('--ry', ry + 'deg');
    scene.style.setProperty('--rx', rx + 'deg');
});

function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(moved){
        scene.style.setProperty('--ry', '0deg');
        scene.style.setProperty('--rx', '0deg');
        /* اگر کشید، کلیک بعدی را نادیده بگیر تا اشتباه شمرده نشود */
        suppressClick = true;
        setTimeout(function(){ suppressClick = false; }, 160);
    }
}

stageEl.addEventListener('pointerup', endDrag);
stageEl.addEventListener('pointercancel', endDrag);
stageEl.addEventListener('pointerleave', endDrag);

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ============================================================
   ماوس سه‌بعدی — بازی آزاد مرحله‌ی آخر
   ============================================================ */

var m3    = m3El;
var m3rx  = 58;
var m3ry  = -22;
var m3on  = false;
var m3lx  = 0;
var m3ly  = 0;

m3.addEventListener('pointerdown', function(e){
    if(e.target.closest('.m3-btn') || e.target.closest('.m3-wheel')) return;
    m3on = true;
    m3lx = e.clientX;
    m3ly = e.clientY;
    try{ m3.setPointerCapture(e.pointerId); }catch(err){}
});

m3.addEventListener('pointermove', function(e){
    if(!m3on) return;
    var dx = e.clientX - m3lx;
    var dy = e.clientY - m3ly;
    m3ry += dx * 0.45;
    m3rx -= dy * 0.45;
    m3rx = Math.max(-20, Math.min(90, m3rx));
    m3.style.setProperty('--m3rx', m3rx + 'deg');
    m3.style.setProperty('--m3ry', m3ry + 'deg');
    m3lx = e.clientX;
    m3ly = e.clientY;
});

function m3Stop(){ m3on = false; }

m3.addEventListener('pointerup', m3Stop);
m3.addEventListener('pointercancel', m3Stop);

/* دکمه‌های چپ و راست */
var m3btns = m3.querySelectorAll('.m3-btn');
for(var mb=0; mb<m3btns.length; mb++){
    (function(btn){
        btn.addEventListener('pointerdown', function(e){
            e.stopPropagation();
            btn.classList.add('pressed');
            vibrate(22);
        });
        var release = function(e){
            e.stopPropagation();
            btn.classList.remove('pressed');
        };
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('pointerleave', release);
    })(m3btns[mb]);
}

/* چرخ — روی گوشی با کشیدن می‌چرخد (رویداد wheel روی لمس وجود ندارد) */
var m3wheel = m3.querySelector('.m3-wheel');
var m3wOn   = false;
var m3wY    = 0;
var m3wPos  = 0;

m3wheel.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    m3wOn = true;
    m3wY = e.clientY;
    try{ m3wheel.setPointerCapture(e.pointerId); }catch(err){}
});

m3wheel.addEventListener('pointermove', function(e){
    if(!m3wOn) return;
    m3wPos += (e.clientY - m3wY);
    m3wheel.style.backgroundPositionY = (m3wPos * 0.5) + 'px';
    m3wY = e.clientY;
});

function m3wStop(){ m3wOn = false; }

m3wheel.addEventListener('pointerup', m3wStop);
m3wheel.addEventListener('pointercancel', m3wStop);

/* ---------------- شروع ---------------- */
render();
</script>

</body>
</html>
