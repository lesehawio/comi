<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>کامپیوتر رو بشناس — سطح ۱</title>
<style>
/* ============================================================
   سطح ۱ — شناخت اجزای کامپیوتر
   تک‌فایل • آفلاین • بدون تصویر بیرونی

   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:
        radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:5px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    font-size:19px;
    cursor:pointer;
    transition:transform .12s ease, background .2s;
}

#replay:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:0;
    position:relative;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
}

#scene g.part{ transition:opacity .4s ease; }

/* حالت تمرکز: بقیه محو */
#scene.focusing g.part{ opacity:.22; }

#scene.focusing g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 11px rgba(74,222,128,.95));
    transform-box:fill-box;
    transform-origin:center;
    animation:spotPulse 1.7s ease-in-out infinite;
}

@keyframes spotPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.055); }
}

#scene g.part.hit{
    filter:drop-shadow(0 0 15px rgba(74,222,128,1));
}

#scene g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.35; }
    50%{ opacity:1; }
}

/* مانیتور: صفحه خاموش / دسکتاپ روشن */
#desktop{
    opacity:0;
    transition:opacity .9s ease .15s;
}

#scene.on #desktop{ opacity:1; }

#caseGlow{
    opacity:0;
    transition:opacity .9s ease;
}

#scene.on #caseGlow{ opacity:1; }

#led{
    fill:#3d4553;
    transition:fill .5s ease;
}

#scene.on #led{
    fill:#4ade80;
    filter:drop-shadow(0 0 4px rgba(74,222,128,1));
}

#powerIconPath, #powerIconArc{
    stroke:#7d8ba0;
    transition:stroke .5s ease;
}

#scene.on #powerIconPath,
#scene.on #powerIconArc{
    stroke:#4ade80;
}

/* دست راهنما */
#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

/* لرزش */
#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    min-width:118px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

.btn.chip{
    flex:0 0 auto;
    min-width:0;
    min-height:50px;
    font-size:15.5px;
    padding:0 15px;
    border-radius:14px;
}

.btn.chip.on{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
}

/* دکمه‌ی شروع */
#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{
        box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12);
    }
    50%{
        box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22);
    }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   انیمیشن تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    font-size:80px;
    color:#4ade80;
    text-shadow:0 0 30px rgba(74,222,128,.95);
    animation:popOk .85s ease-out forwards;
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

/* ستاره‌های پایان */
.star{
    position:fixed;
    font-size:26px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

/* =========================
   صفحه‌ی کوچک
   ========================= */

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    .btn.chip{ min-height:46px; font-size:14.5px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="replay" title="دوباره">🔁</button>
    </div>

    <div id="stage">
        <!-- ============================================================
             صحنه‌ی میز کامپیوتر — هر قطعه یک data-part دارد
             ============================================================ -->
        <svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gCase" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#414a5a"/>

                </linearGradient>

                    <stop offset="0" stop-color="#1d4f7a"/>

                </linearGradient>
                <linearGradient id="gKey" x1="0" y1="0" x2="0" y2="1">

            <!-- ================= میز ================= -->

                <line x1="36" y1="196" x2="86" y2="196" stroke="#1a2029" stroke-width="1.4"/>

                <line x1="36" y1="206" x2="86" y2="206" stroke="#1a2029" stroke-width="1.4"/>

                <g id="desktop">

                    <circle cx="170" cy="169" r="3.6" fill="#4ade80"/>

                    <rect x="196" y="93" width="104" height="62" rx="3.5" fill="#eef3f9"/>
                    <rect x="196" y="93" width="104" height="11" rx="3.5" fill="#c6d0dc"/>

<script>
/* ============================================================
   ۱) محتوای درس‌ها — فقط همین بخش را عوض کن
   ============================================================ */

/* هر قطعه: [اسم، یک جمله توضیح] */
var PARTS = {
    case:     ['کیس',        'همه‌ی کارای کامپیوتر توش انجام می‌شه. مثل مغز.'],
    monitor:  ['مانیتور',    'نتیجه‌ی کارت رو نشون می‌ده. مثل صورت.'],
    mouse:    ['ماوس',       'با این می‌گی کجا بره. مثل دست.'],
    keyboard: ['کیبورد',     'با این حرف می‌نویسی. مثل دهن.'],
    power:    ['دکمه‌ی پاور', 'اینجا رو می‌زنی، کامپیوتر روشن می‌شه.'],
    usb:      ['پورت USB',   'فلش مموری اینجا می‌ره.'],
    jack:     ['جک هدفون',   'هدفون رو اینجا می‌زنی.']
};

/* محل دست راهنما روی صحنه */
var HINT_POS = {
    case:     [61, 84],
    monitor:  [236, 58],
    mouse:    [344, 212],
    keyboard: [220, 226],
    power:    [82, 88],
    usb:      [49, 118],
    jack:     [49, 154]
};

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'case'     },
    { t:'teach', part:'monitor'  },
    { t:'teach', part:'mouse'    },
    { t:'teach', part:'keyboard' },

    { t:'find',  part:'mouse',    ask:'ماوس رو پیدا کن'    },
    { t:'find',  part:'case',     ask:'کیس رو پیدا کن'     },
    { t:'find',  part:'keyboard', ask:'کیبورد رو پیدا کن'  },
    { t:'find',  part:'monitor',  ask:'مانیتور رو پیدا کن' },

    { t:'name',  part:'mouse'    },
    { t:'name',  part:'monitor'  },

    { t:'teach', part:'power'    },
    { t:'teach', part:'usb'      },
    { t:'teach', part:'jack'     },

    { t:'find',  part:'power',    ask:'دکمه‌ی پاور رو پیدا کن' },
    { t:'find',  part:'usb',      ask:'پورت USB رو پیدا کن'   },

    { t:'final'  },
    { t:'recap'  }
];

/* ============================================================
   ۲) موتور برنامه — لازم نیست دست بزنی
   ============================================================ */

var scene    = document.getElementById('scene');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var titleEl  = document.getElementById('title');
var textEl   = document.getElementById('text');
var actEl    = document.getElementById('actions');
var burstEl  = document.getElementById('burst');
var panelIn  = document.getElementById('panelInner');
var handEl   = document.getElementById('hintHand');
var stageEl  = document.getElementById('stage');

var i = 0;
var wrongCount = 0;
var lock = false;

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function partEl(name){
    return scene.querySelector('[data-part="' + name + '"]');
}

/* بالا رفتن از درخت DOM تا رسیدن به قطعه */
function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function clearMarks(){
    var all = scene.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
}

function hideHand(){
    handEl.classList.remove('show');
}

function showHand(part){
    var p = HINT_POS[part];
    if(!p) return;
    handEl.setAttribute('transform','translate(' + p[0] + ',' + p[1] + ')');
    handEl.classList.add('show');
}

function showBurst(){
    burstEl.innerHTML = '<div class="ring"></div><div class="ok">✓</div>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<14;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.textContent = '⭐';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (30 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            b.textContent = item.label;
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ---------------- نمایش هر مرحله ---------------- */

function render(){
    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    clearMarks();
    if(s.t !== 'recap'){ scene.classList.remove('on'); }
    replayAnim();

    /* نوار پیشرفت */
    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        titleEl.textContent = 'کامپیوتر رو بشناس';
        textEl.textContent  = 'یه دستگاه که کارات رو راه می‌ندازه. بریم ببینیم از چی ساخته شده.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی قطعه ---------- */
    if(s.t === 'teach'){
        var p = PARTS[s.part];
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        titleEl.textContent = p[0];
        textEl.textContent  = p[1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- این چیه؟ ---------- */
    if(s.t === 'name'){
        scene.classList.add('focusing');
        partEl(s.part).classList.add('spot');
        titleEl.textContent = 'این چیه؟';
        textEl.textContent  = 'روی جواب درست بزن.';

        var others = [];
        for(var key in PARTS){
            if(key !== s.part){ others.push(key); }
        }
        others.sort(function(){ return Math.random() - 0.5; });

        var choices = [s.part, others[0], others[1]];
        choices.sort(function(){ return Math.random() - 0.5; });

        var list = [];
        for(var c=0;c<choices.length;c++){
            (function(name){
                list.push({
                    label: PARTS[name][0],
                    onClick: function(){
                        if(name === s.part){ correct(partEl(name)); }
                        else { wrongAnswer(); }
                    }
                });
            })(choices[c]);
        }
        setButtons(list);
        return;
    }

    /* ---------- پایان ---------- */
    if(s.t === 'final'){
        titleEl.textContent = 'نوبت توئه';
        textEl.textContent  = 'دکمه‌ی پاور رو بزن و کامپیوتر رو روشن کن.';
        setButtons([]);
        return;
    }

    /* ---------- جمع‌بندی ---------- */
    if(s.t === 'recap'){
        titleEl.textContent = 'همه رو شناختی';
        textEl.textContent  = 'روی هر کدوم بزن تا دوباره نشونت بده.';
        var chips = [];
        for(var kk in PARTS){
            (function(name){
                chips.push({
                    label: PARTS[name][0],
                    cls: 'chip',
                    onClick: function(){
                        clearMarks();
                        scene.classList.add('focusing');
                        partEl(name).classList.add('spot');
                        titleEl.textContent = PARTS[name][0];
                        textEl.textContent  = PARTS[name][1];
                        vibrate(25);
                    }
                });
            })(kk);
        }
        chips.push({ label:'از اول', cls:'main', onClick: function(){ i = 0; render(); } });
        setButtons(chips);
        return;
    }
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

/* ---------------- بازخورد ---------------- */

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();
    setTimeout(function(){
        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';
    if(wrongCount >= 2 && LESSON[i].part){
        partEl(LESSON[i].part).classList.add('hint');
        showHand(LESSON[i].part);
    }
}

/* ---------------- کلیک روی صحنه ---------------- */

scene.addEventListener('click', function(e){
    if(lock) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        var want = s.part;
        var ok = (tapped === want) ||
                 (want === 'case' && (tapped === 'power' || tapped === 'usb' || tapped === 'jack'));
        if(ok){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'final'){
        if(tapped === 'power'){
            lock = true;
            partEl('power').classList.add('hit');
            scene.classList.add('on');
            handEl.classList.remove('show');
            vibrate([40, 60, 40, 60, 140]);
            showBurst();
            stars();
            setTimeout(stars, 300);
            titleEl.textContent = 'آفرین!';
            textEl.textContent  = 'کامپیوتر روشن شد. حالا همه‌ی قطعه‌هاش رو می‌شناسی.';
            setButtons([{ label:'جمع‌بندی', cls:'main', onClick:next }]);
        } else {
            wrongAnswer();
        }
    }
    else if(s.t === 'recap'){
        /* در جمع‌بندی، هر کلیک روی صحنه هم همان قطعه را نشان می‌دهد */
        var name = tapped;
        clearMarks();
        scene.classList.add('focusing');
        partEl(name).classList.add('spot');
        titleEl.textContent = PARTS[name][0];
        textEl.textContent  = PARTS[name][1];
        vibrate(25);
    }
});

/* ---------------- دکمه‌ها ---------------- */

document.getElementById('replay').onclick = function(){
    vibrate(20);
    render();
};

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ---------------- شروع ---------------- */
render();
</script>

</body>
</html>
