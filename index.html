<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="کامی">
<title>کامی — آموزش کامپیوتر</title>
<link rel="icon" href="https://raw.githubusercontent.com/lesehawio/comi/main/A/comi1.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/lesehawio/comi/main/A/comi1.png">
<style>
/* ============================================================
   کامی — آموزش کامپیوتر
   تم: نئون بنفش-آبی الهام‌گرفته از تصاویر
   ============================================================ */

:root{
    --bg:        #0a0618;
    --bg-2:      #14092b;
    --stroke:    rgba(168,130,255,.14);
    --stroke-2:  rgba(168,130,255,.28);
    --text:      #f0e9ff;
    --muted:     #9b8ec2;
    --dim:       #6b5f8e;
    --purple:    #a855f7;
    --blue:      #38bdf8;
    --pink:      #e879f9;
    --cyan:      #22d3ee;
    --green:     #4ade80;
    --shadow:    0 18px 44px rgba(88,28,135,.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    direction:rtl;
    color:var(--text);
    background:var(--bg);
}

#app{
    height:100dvh;
    height:100vh;
    max-width:520px;
    margin:0 auto;
    position:relative;
    overflow:hidden;
    isolation:isolate;
}

/* نورهای پس‌زمینه — بنفش و آبی */
#app::before{
    content:'';
    position:absolute;
    inset:-25%;
    z-index:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 18% 8%,  rgba(168,85,247,.30), rgba(0,0,0,0) 42%),
        radial-gradient(circle at 88% 18%, rgba(56,189,248,.24), rgba(0,0,0,0) 44%),
        radial-gradient(circle at 50% 108%, rgba(232,121,249,.18), rgba(0,0,0,0) 52%);
    filter:blur(70px);
    animation:aurora 22s ease-in-out infinite alternate;
}

@keyframes aurora{
    0%{ transform:translate3d(0,0,0) scale(1); }
    100%{ transform:translate3d(-3%,3%,0) scale(1.08); }
}

.screen{
    position:absolute;
    inset:0;
    z-index:1;
    display:none;
    flex-direction:column;
}

.screen.show{ display:flex; }

/* ============================================================
   هدر منو — اسلایدر تمام‌عرض + نوار کاملاً شفاف روی آن
   ============================================================ */

.menu-head{
    position:relative;
    flex:0 0 auto;
    width:100%;
    height:34vh;
    min-height:220px;
    max-height:320px;
    overflow:hidden;
    z-index:2;
}

.slide-track{
    position:absolute;
    inset:0;
    z-index:1;
    background:#0a0618;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.4s ease;
    will-change:opacity;
}

.slide.show{
    opacity:1;
    z-index:1;
}

.slide img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

/* محو شدن تدریجی پایین هدر */
.menu-head::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    z-index:3;
    pointer-events:none;
    background:linear-gradient(
        180deg,
        rgba(10,6,24,0) 0%,
        rgba(10,6,24,.35) 40%,
        rgba(10,6,24,.75) 70%,
        rgba(10,6,24,1) 100%
    );
}

/* نوار روی هدر — بدون پس‌زمینه، فقط متن و شیشه */
.menu-bar{
    position:absolute;
    top:0; left:0; right:0;
    height:60px;
    z-index:4;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    /* ✅ بدون بک‌گراند — کاملاً شفاف */
    background:transparent;
    /* سایه‌ی متن برای خوانایی روی هر تصویری */
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16px;
    font-weight:bold;
    letter-spacing:.2px;
    color:#fff;
    text-shadow:
        0 1px 3px rgba(0,0,0,.85),
        0 2px 12px rgba(0,0,0,.7);
}

.brand img{
    display:block;
    width:38px;
    height:38px;
    object-fit:contain;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.6));
}

.spacer{ flex:1; }

.prof{
    display:flex;
    align-items:center;
    gap:7px;
    height:38px;
    padding:0 12px 0 8px;
    border-radius:20px;
    /* ✅ شیشه‌ی شفاف خیلی ملایم */
    border:1px solid rgba(255,255,255,.14);
    background:rgba(10,6,24,.22);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    color:#fff;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    max-width:140px;
    transition:transform .14s ease, background .2s;
    text-shadow:0 1px 3px rgba(0,0,0,.7);
}

.prof:active{ transform:scale(.96); background:rgba(10,6,24,.4); }

.prof b{
    display:grid;
    place-items:center;
    width:24px;
    height:24px;
    flex:0 0 auto;
    border-radius:50%;
    background:linear-gradient(180deg,#c084fc,#7c3aed);
    color:#fff;
    font-size:12px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(168,85,247,.6);
}

.prof span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

/* ============================================================
   سرصفحه‌ی صفحات داخلی
   ============================================================ */

.hdr{
    flex:0 0 auto;
    height:60px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    background:linear-gradient(180deg, rgba(168,85,247,.08), rgba(168,85,247,.02));
    border-bottom:1px solid var(--stroke);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}

.icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(168,85,247,.10), rgba(168,85,247,.04));
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    color:#d8c5ff;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .14s ease, background .2s;
}

.icon:active{ transform:scale(.94); background:rgba(168,85,247,.20); }
.icon svg{ width:18px; height:18px; }

.hdr .ht{
    flex:1;
    font-size:15px;
    font-weight:bold;
    color:var(--text);
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* ============================================================
   بدنه
   ============================================================ */

.body{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 16px 40px;
    position:relative;
    z-index:1;
}

.secLabel{
    font-size:11.5px;
    color:var(--dim);
    letter-spacing:1px;
    margin:0 4px 10px;
    font-weight:bold;
}

/* ============================================================
   کارت شیشه‌ای — با تم بنفش
   ============================================================ */

.card{
    position:relative;
    background:linear-gradient(180deg, rgba(168,85,247,.10), rgba(56,189,248,.05));
    border:1px solid var(--stroke);
    border-radius:22px;
    padding:18px;
    margin-bottom:14px;
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
}

.card::before{
    content:'';
    position:absolute;
    left:12%;
    right:12%;
    top:0;
    height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(232,121,249,.55), rgba(255,255,255,0));
    pointer-events:none;
}

.card .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:bold;
    letter-spacing:.7px;
    padding:4px 10px;
    border-radius:9px;
    background:rgba(56,189,248,.15);
    border:1px solid rgba(56,189,248,.30);
    color:#7dd3fc;
    margin-bottom:10px;
}

.card .tag.amber{
    background:rgba(232,121,249,.15);
    border-color:rgba(232,121,249,.30);
    color:#f0abfc;
}

.card h2{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
    line-height:1.5;
    letter-spacing:.2px;
}

.card p{
    font-size:13px;
    color:var(--muted);
    line-height:1.9;
    margin-bottom:14px;
}

/* ============================================================
   دکمه‌ها
   ============================================================ */

.btn{
    display:block;
    width:100%;
    min-height:46px;
    border-radius:14px;
    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(168,85,247,.10), rgba(56,189,248,.05));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:transform .14s ease, background .2s;
}

.btn:active{ transform:scale(.975); background:rgba(168,85,247,.20); }

.btn.solid{
    background:linear-gradient(135deg,#a855f7,#38bdf8);
    border-color:rgba(255,255,255,.28);
    color:#fff;
    box-shadow:
        0 10px 28px rgba(168,85,247,.42),
        inset 0 1px 0 rgba(255,255,255,.45);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
}

.btn.solid:active{ background:linear-gradient(135deg,#9333ea,#0ea5e9); }

.btn.amber{
    background:linear-gradient(135deg,#e879f9,#c026d3);
    border-color:rgba(255,255,255,.28);
    color:#fff;
    box-shadow:
        0 10px 28px rgba(232,121,249,.38),
        inset 0 1px 0 rgba(255,255,255,.42);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
}

.card.slim{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
}

.card.slim .k{
    font-size:15px;
    font-weight:bold;
    margin-bottom:4px;
}

.card.slim .v{
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
}

.ghost{
    flex:0 0 auto;
    min-height:38px;
    padding:0 18px;
    border-radius:12px;
    border:1px solid rgba(168,85,247,.5);
    background:rgba(168,85,247,.14);
    color:#d8b4fe;
    font-family:inherit;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:transform .14s ease, background .2s;
}

.ghost:active{ transform:scale(.95); background:rgba(168,85,247,.28); }

/* ============================================================
   پروفایل (خوش‌آمد)
   ============================================================ */

.center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
    overflow-y:auto;
}

.hero{
    position:relative;
    margin-bottom:22px;
    display:grid;
    place-items:center;
}

.hero::before{
    content:'';
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(168,85,247,.35), rgba(168,85,247,0) 68%);
    filter:blur(24px);
    pointer-events:none;
}

.hero img{
    position:relative;
    display:block;
    width:130px;
    height:130px;
    object-fit:contain;
    filter:drop-shadow(0 14px 30px rgba(168,85,247,.5));
    animation:heroIn .8s cubic-bezier(.2,.9,.3,1) both;
}

@keyframes heroIn{
    from{ opacity:0; transform:scale(.82) translateY(14px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
}

.panel{
    position:relative;
    width:100%;
    max-width:360px;
    background:linear-gradient(180deg, rgba(168,85,247,.10), rgba(56,189,248,.05));
    border:1px solid var(--stroke);
    border-radius:24px;
    padding:22px 20px;
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.12);
    text-align:center;
}

.panel::before{
    content:'';
    position:absolute;
    left:14%;
    right:14%;
    top:0;
    height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(232,121,249,.55), rgba(255,255,255,0));
}

h1{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
    letter-spacing:.2px;
}

.lead{
    font-size:13px;
    color:var(--muted);
    line-height:2;
    margin-bottom:18px;
}

#nameInput{
    width:100%;
    height:50px;
    border-radius:14px;
    border:1px solid var(--stroke);
    background:rgba(0,0,0,.30);
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    text-align:center;
    padding:0 14px;
    outline:none;
    transition:border-color .2s, background .2s;
    margin-bottom:12px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.4);
}

#nameInput:focus{
    border-color:rgba(168,85,247,.6);
    background:rgba(0,0,0,.4);
}

.note{
    font-size:11.5px;
    color:var(--dim);
    line-height:1.9;
    margin-top:14px;
}

/* ============================================================
   قاب درس و امتحان
   ============================================================ */

#frame{
    flex:1;
    width:100%;
    border:none;
    background:#0a0618;
    display:block;
}

/* ============================================================
   کارنامه
   ============================================================ */

#repBody{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px 40px;
}

.student-card{
    position:relative;
    background:linear-gradient(180deg, rgba(168,85,247,.18), rgba(56,189,248,.06));
    border:1px solid rgba(168,85,247,.32);
    border-radius:22px;
    padding:18px 16px;
    margin-bottom:14px;
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.16);
    overflow:hidden;
}

.student-card::before{
    content:'';
    position:absolute;
    left:16%; right:16%; top:0; height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(232,121,249,.6), rgba(255,255,255,0));
}

.stu-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.stu-avatar{
    width:48px;
    height:48px;
    flex:0 0 auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg,#c084fc,#7c3aed);
    color:#fff;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 6px 18px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.4);
}

.stu-info{
    flex:1;
    min-width:0;
}

.stu-info .nm{
    font-size:16px;
    font-weight:bold;
    color:#fff;
    margin-bottom:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.stu-info .st{
    font-size:11.5px;
    color:#c4b5fd;
    display:flex;
    align-items:center;
    gap:5px;
}

.stu-info .st .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
}

.stu-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.stu-stats div{
    background:rgba(0,0,0,.28);
    border:1px solid rgba(168,85,247,.16);
    border-radius:11px;
    padding:7px 3px;
    text-align:center;
}

.stu-stats .n{
    font-size:14px;
    font-weight:bold;
    color:#c4b5fd;
    display:block;
    line-height:1.2;
}

.stu-stats .l{
    font-size:9.5px;
    color:var(--muted);
    margin-top:2px;
    display:block;
}

.rep-actions{
    display:flex;
    gap:7px;
    margin-bottom:14px;
}

.rep-actions button{
    flex:1;
    min-height:42px;
    border-radius:12px;
    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(168,85,247,.10), rgba(56,189,248,.05));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    color:#d8c5ff;
    font-family:inherit;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:0 6px;
    transition:transform .14s ease, background .2s, color .2s;
}

.rep-actions button:active{ transform:scale(.96); background:rgba(168,85,247,.22); }

.rep-actions button svg{
    width:14px; height:14px;
    stroke:currentColor;
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rep-actions button.green{
    border-color:rgba(168,85,247,.5);
    background:linear-gradient(180deg, rgba(168,85,247,.20), rgba(168,85,247,.08));
    color:#d8b4fe;
}

.copy-toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(70px);
    background:linear-gradient(135deg,#a855f7,#38bdf8);
    color:#fff;
    font-size:13px;
    font-weight:bold;
    padding:10px 18px;
    border-radius:14px;
    box-shadow:0 12px 28px rgba(168,85,247,.55);
    z-index:999;
    opacity:0;
    transition:all .35s cubic-bezier(.2,.9,.3,1);
    pointer-events:none;
    font-family:inherit;
    text-shadow:0 1px 2px rgba(0,0,0,.3);
}

.copy-toast.show{
    transform:translateX(-50%) translateY(0);
    opacity:1;
}

.sec-title{
    font-size:11.5px;
    color:var(--dim);
    letter-spacing:1px;
    margin:6px 4px 10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:7px;
}

.sec-title::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(168,85,247,.20), transparent);
}

.item{
    position:relative;
    background:linear-gradient(180deg, rgba(168,85,247,.08), rgba(56,189,248,.03));
    border:1px solid var(--stroke);
    border-radius:16px;
    padding:12px 14px 11px;
    margin-bottom:8px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 10px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.10);
    overflow:hidden;
}

.item::before{
    content:'';
    position:absolute;
    right:0; top:0; bottom:0;
    width:3px;
    border-radius:0 16px 16px 0;
}

.item[data-grade="great"]::before{ background:linear-gradient(180deg,#4ade80,#22c55e); }
.item[data-grade="good"]::before{ background:linear-gradient(180deg,#e879f9,#c026d3); }
.item[data-grade="bad"]::before{  background:linear-gradient(180deg,#f87171,#dc2626); }

.item .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:4px;
}

.item .exam-name{
    font-size:12.5px;
    font-weight:bold;
    color:#f0e9ff;
}

.item .sc{
    font-size:14px;
    font-weight:bold;
    color:var(--text);
    white-space:nowrap;
}

.item .sc em{
    font-style:normal;
    color:#a5f3fc;
    font-size:17px;
}

.item[data-grade="bad"] .sc em{ color:#fca5a5; }
.item[data-grade="good"] .sc em{ color:#f0abfc; }

.item .dt{
    font-size:10.5px;
    color:var(--dim);
    margin-bottom:7px;
}

.item .bar{
    height:4px;
    background:rgba(168,85,247,.10);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:7px;
}

.item .bar i{
    display:block;
    height:100%;
    border-radius:10px;
}

<script>
/* ============================================================
   ۱) تنظیمات
   ============================================================ */

var LESSON_FILE  = '1-1.html';
var LESSON_TITLE = 'اجزای کامپیوتر';
var LESSON_SUB   = 'کیس • مانیتور • ماوس • کیبورد • پاور • USB • هدفون';

var EXAM_FILE    = 'e-1.html';
var EXAM_TITLE   = 'امتحان ۱';
var EXAM_SUB     = '۸ سؤال چهارگزینه‌ای';

/* ============================================================
   ۲) ذخیره‌سازی
   ============================================================ */

var KEY = 'kami_level1_v1';

var ST = { name:'', scores:[] };

function loadState(){
    try{
        var raw = localStorage.getItem(KEY);
        if(raw){
            var o = JSON.parse(raw);
            if(o && typeof o === 'object'){
                ST.name   = o.name   || '';
                ST.scores = o.scores || [];
            }
        }
    }catch(e){}
}

function saveState(){
    try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
}

/* ============================================================
   ۳) ابزار
   ============================================================ */

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){ return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; }); }

function el(id){ return document.getElementById(id); }

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function escapeHtml(s){
    return String(s == null ? '' : s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

function show(which){
    var all = document.querySelectorAll('.screen');
    for(var k=0;k<all.length;k++){ all[k].classList.remove('show'); }
    el(which).classList.add('show');
}

function initialOf(name){
    var s = String(name || '').trim();
    return s ? s.charAt(0) : '؟';
}

function prettyDate(iso){
    if(!iso) return '';
    try{
        var d = new Date(iso);
        if(isNaN(d.getTime())){
            return String(iso);
        }

        var faDate = '';
        try{
            faDate = d.toLocaleDateString('fa-IR', {
                year:'numeric', month:'2-digit', day:'2-digit'
            });
        }catch(e){
            faDate = d.getFullYear() + '/' +
                     ('0'+(d.getMonth()+1)).slice(-2) + '/' +
                     ('0'+d.getDate()).slice(-2);
        }

        var faTime = '';
        try{
            faTime = d.toLocaleTimeString('fa-IR', {
                hour:'2-digit', minute:'2-digit'
            });
        }catch(e){
            faTime = ('0'+d.getHours()).slice(-2) + ':' +
                     ('0'+d.getMinutes()).slice(-2);
        }

        return faDate + ' — ' + faTime;
    }catch(e){
        return String(iso);
    }
}

/* ============================================================
   ۴) پروفایل
   ============================================================ */

var NAME_LOCK = false;

function saveName(v){

    v = String(v || '').trim();

    if(!v){
        var inp = el('nameInput').offsetParent ? el('nameInput') : el('setName');
        inp.style.borderColor = '#f87171';
        setTimeout(function(){ inp.style.borderColor = ''; }, 1000);
        return false;
    }

    ST.name = v;
    saveState();
    NAME_LOCK = true;
    vibrate(20);
    return true;
}

el('saveName').onclick = function(){
    if(saveName(el('nameInput').value)){ openMenu(); }
};

el('nameInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ el('saveName').click(); }
});

/* ============================================================
   ۵) منو
   ============================================================ */

function paintProfile(){
    el('profName').textContent   = ST.name || '—';
    el('profLetter').textContent = initialOf(ST.name);
}

function openMenu(){

    if(!ST.name && !NAME_LOCK){
        el('nameInput').value = '';
        show('scProfile');
        return;
    }

    show('scMenu');

    paintProfile();

    el('lessonTitle').textContent = LESSON_TITLE;
    el('lessonSub').textContent   = LESSON_SUB;
    el('examTitle').textContent   = EXAM_TITLE;
    el('examSub').textContent     = EXAM_SUB;

    var n = ST.scores.length;

    if(!n){
        el('repSummary').textContent = 'هنوز امتحانی نداده‌ای';
    } else {
        var best = 0;
        for(var k=0;k<n;k++){
            if(ST.scores[k].pct > best){ best = ST.scores[k].pct; }
        }
        el('repSummary').textContent = 'بهترین نمره: ' + fa(best) + '٪  •  ' + fa(n) + ' بار امتحان';
    }
}

el('profChip').onclick = function(){
    vibrate(15);
    openSettings();
};

/* ============================================================
   ۶) نمایش درس یا امتحان
   ============================================================ */

function openViewer(file, title){
    el('viewTitle').textContent = title;
    el('frame').src = file;
    show('scView');
    vibrate(20);
}

el('openLesson').onclick = function(){
    openViewer(LESSON_FILE, LESSON_TITLE);
};

el('openExam').onclick = function(){
    openViewer(EXAM_FILE, EXAM_TITLE);
};

el('viewBack').onclick = function(){
    el('frame').src = 'about:blank';
    openMenu();
};

window.addEventListener('message', function(e){
    if(e.data && e.data.kami === 'home'){
        el('frame').src = 'about:blank';
        openMenu();
    }
});

/* ============================================================
   ۷) کارنامه
   ============================================================ */

function openReport(){
    show('scReport');

    if(!ST.scores.length){
        el('repBody').innerHTML =
            '<div class="student-card">' +
                '<div class="stu-row">' +
                    '<div class="stu-avatar">' + escapeHtml(initialOf(ST.name)) + '</div>' +
                    '<div class="stu-info">' +
                        '<div class="nm">' + escapeHtml(ST.name || 'بی‌نام') + '</div>' +
                        '<div class="st"><span class="dot"></span>هنوز امتحانی نداده‌ای</div>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="empty">' +
              '<span class="big-emoji">📋</span>' +
              'کارنامه‌ات خالی است.<br>' +
              'از منو، «شروع امتحان» را بزن.' +
            '</div>';
        return;
    }

    var scores = ST.scores;
    var n      = scores.length;
    var best   = 0;
    var sum    = 0;
    var last   = scores[n - 1];

    for(var k = 0; k < n; k++){
        var p = scores[k].pct || 0;
        sum += p;
        if(p > best) best = p;
    }
    var avg = Math.round(sum / n);

    var status, statusColor;
    if(avg >= 85){ status = 'عالی — ادامه بده'; statusColor = '#4ade80'; }
    else if(avg >= 70){ status = 'خوب — قابل پیشرفت'; statusColor = '#a5f3fc'; }
    else if(avg >= 50){ status = 'متوسط — نیاز به تمرین'; statusColor = '#f0abfc'; }
    else { status = 'ضعیف — تمرین بیشتر'; statusColor = '#fca5a5'; }

    var h = '';

    h += '<div class="student-card">';
    h +=   '<div class="stu-row">';
    h +=     '<div class="stu-avatar">' + escapeHtml(initialOf(ST.name)) + '</div>';
    h +=     '<div class="stu-info">';
    h +=       '<div class="nm">' + escapeHtml(ST.name || 'بی‌نام') + '</div>';
    h +=       '<div class="st"><span class="dot" style="background:' + statusColor + ';box-shadow:0 0 8px ' + statusColor + '"></span>' + status + '</div>';
    h +=     '</div>';
    h +=   '</div>';
    h +=   '<div class="stu-stats">';
    h +=     '<div><span class="n">' + fa(n)    + '</span><span class="l">امتحان</span></div>';
    h +=     '<div><span class="n">' + fa(best) + '٪</span><span class="l">بهترین</span></div>';
    h +=     '<div><span class="n">' + fa(avg)  + '٪</span><span class="l">میانگین</span></div>';
    h +=     '<div><span class="n">' + fa(last ? last.pct : 0) + '٪</span><span class="l">آخری</span></div>';
    h +=   '</div>';
    h += '</div>';

    h += '<div class="rep-actions">';
    h +=   '<button id="repCopy" class="green">';
    h +=     '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
    h +=     'کپی JSON';
    h +=   '</button>';
    h +=   '<button id="repDownload">';
    h +=     '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    h +=     'دانلود فایل';
    h +=   '</button>';
    h += '</div>';

    h += '<div class="sec-title">سوابق امتحانات</div>';

    for(var j = n - 1; j >= 0; j--){
        var r   = scores[j];
        var pct = r.pct || 0;
        var gr  = pct >= 80 ? 'great' : (pct >= 50 ? 'good' : 'bad');
        var dateStr = prettyDate(r.date);

        h += '<div class="item" data-grade="' + gr + '">';
        h +=   '<div class="top">';
        h +=     '<span class="exam-name">' + escapeHtml(r.exam || EXAM_TITLE) + '</span>';
        h +=     '<span class="sc"><em>' + fa(r.score) + '</em> / ' + fa(r.total) + '</span>';
        h +=   '</div>';
        h +=   '<div class="dt">' + escapeHtml(dateStr) + ' &nbsp;•&nbsp; ' + fa(pct) + '٪</div>';
        h +=   '<div class="bar"><i style="width:' + pct + '%"></i></div>';

        if(r.wrong && r.wrong.length){
            h += '<div class="wr"><b>اشتباه‌ها:</b><br>';
            for(var w = 0; w < r.wrong.length; w++){
                h += '• ' + escapeHtml(r.wrong[w]) + '<br>';
            }
            h += '</div>';
        } else {
            h += '<div class="wr"><span class="ok">✓ همه را درست زدی</span></div>';
        }
        h += '</div>';
    }

    el('repBody').innerHTML = h;

    el('repCopy').onclick     = copyJson;
    el('repDownload').onclick = downloadJson;
}

/* ============================================================
   ساخت JSON
   ============================================================ */

function buildStudentJson(){
    return {
        app:      'کامی',
        version:  '1.0',
        exported: new Date().toISOString(),
        student: {
            name: ST.name || 'بی‌نام'
        },
        summary: (function(){
            var n = ST.scores.length;
            if(!n) return { total: 0, best: 0, avg: 0, last: 0 };

            var best = 0, sum = 0;
            for(var i = 0; i < n; i++){
                var p = ST.scores[i].pct || 0;
                sum += p;
                if(p > best) best = p;
            }
            return {
                total: n,
                best:  best,
                avg:   Math.round(sum / n),
                last:  ST.scores[n - 1].pct || 0
            };
        })(),
        scores: ST.scores.map(function(r){
            return {
                exam:  r.exam || EXAM_TITLE,
                date:  r.date,
                score: r.score,
                total: r.total,
                pct:   r.pct,
                wrong: r.wrong || []
            };
        })
    };
}

function copyJson(){
    var json = JSON.stringify(buildStudentJson(), null, 2);

    function done(){
        vibrate([20, 40, 20]);
        showToast('JSON کپی شد ✓');
    }

    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(json).then(done).catch(function(){
            fallbackCopy(json, done);
        });
    } else {
        fallbackCopy(json, done);
    }
}

function fallbackCopy(text, cb){
    try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok) cb();
        else showToast('کپی نشد — دستی انتخاب کن', '#fca5a5');
    }catch(e){
        showToast('کپی نشد', '#fca5a5');
    }
}

function downloadJson(){
    try{
        var json = JSON.stringify(buildStudentJson(), null, 2);
        var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
        var url  = URL.createObjectURL(blob);

        var safeName = (ST.name || 'student').replace(/[^\u0600-\u06FF\w\-]/g, '_');
        var fileName = 'kami-' + safeName + '-' + Date.now() + '.json';

        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

        vibrate([20, 40, 20]);
        showToast('فایل ذخیره شد ✓');
    }catch(e){
        showToast('دانلود نشد', '#fca5a5');
    }
}

function showToast(text, color){
    var old = document.querySelector('.copy-toast');
    if(old) old.remove();

    var t = document.createElement('div');
    t.className = 'copy-toast';
    t.textContent = text;
    if(color){
        t.style.background = 'linear-gradient(180deg, #fca5a5, #dc2626)';
        t.style.color = '#fff';
        t.style.boxShadow = '0 12px 28px rgba(248,113,113,.5)';
    }
    document.body.appendChild(t);

    requestAnimationFrame(function(){ t.classList.add('show'); });

    setTimeout(function(){
        t.classList.remove('show');
        setTimeout(function(){ t.remove(); }, 400);
    }, 2200);
}

/* ============================================================
   ۸) تنظیمات
   ============================================================ */

function openSettings(){
    el('setName').value  = ST.name || '';
    el('setMsg').textContent = '';
    show('scSet');
}

el('setBack').onclick = openMenu;

el('setNameSave').onclick = function(){
    if(saveName(el('setName').value)){
        el('setMsg').textContent = 'اسم ذخیره شد';
        el('setMsg').style.color = '#4ade80';
        paintProfile();
    } else {
        el('setMsg').textContent = 'اسم را بنویس';
        el('setMsg').style.color = '#fca5a5';
    }
};

/* ============================================================
   ۹) اسلایدر هدر
   ============================================================ */

var SLIDES = [
    'https://raw.githubusercontent.com/lesehawio/comi/main/A/comi2.png',
    'https://raw.githubusercontent.com/lesehawio/comi/main/A/comi3.png',
    'https://raw.githubusercontent.com/lesehawio/comi/main/A/comi4.png',
    'https://raw.githubusercontent.com/lesehawio/comi/main/A/comi8.png',
    'https://raw.githubusercontent.com/lesehawio/comi/main/A/comi9.png'
];

var SLIDE_MS   = 8000;
var slideTimer = null;
var slideIndex = -1;
var slideNodes = [];

function buildSlider(){

    var track = document.getElementById('slideTrack');
    if(!track) return;

    track.innerHTML = '';
    slideNodes = [];

    for(var k = 0; k < SLIDES.length; k++){

        var s = document.createElement('div');
        s.className = 'slide';

        var img = document.createElement('img');
        img.src = SLIDES[k];
        img.alt = 'کامی ' + (k + 1);
        img.draggable = false;

        s.appendChild(img);
        track.appendChild(s);
        slideNodes.push(s);
    }
}

function pickRandomIndex(){

    if(SLIDES.length <= 1) return 0;

    var n;
    var guard = 0;
    do {
        n = Math.floor(Math.random() * SLIDES.length);
        guard++;
    } while(n === slideIndex && guard < 20);

    if(n === slideIndex){
        n = (slideIndex + 1) % SLIDES.length;
    }

    return n;
}

function nextSlide(){

    if(!slideNodes.length) return;

    var newIndex = pickRandomIndex();
    var prev     = slideIndex;

    if(prev >= 0 && slideNodes[prev]){
        slideNodes[prev].classList.remove('show');
    }

    slideNodes[newIndex].classList.add('show');
    slideIndex = newIndex;
}

function startSlider(){

    buildSlider();

    if(!slideNodes.length) return;

    slideIndex = Math.floor(Math.random() * SLIDES.length);
    slideNodes[slideIndex].classList.add('show');

    if(slideTimer) clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, SLIDE_MS);
}

document.addEventListener('visibilitychange', function(){
    if(document.hidden){
        if(slideTimer){ clearInterval(slideTimer); slideTimer = null; }
    } else {
        if(!slideTimer && slideNodes.length){
            slideTimer = setInterval(nextSlide, SLIDE_MS);
        }
    }
});

/* ============================================================
   ۱۰) شروع
   ============================================================ */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

loadState();

if(ST.name){
    openMenu();
} else {
    show('scProfile');
}

if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', startSlider);
} else {
    startSlider();
}

el('openReport').onclick = openReport;
el('repBack').onclick    = openMenu;
</script>
