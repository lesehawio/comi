    no: 3,

    qs: [
        { cap:'', q:'کار اصلی کامپیوتر کجاست؟',
          opts:['توی کیس','توی مانیتور','توی ماوس'], a:0 },

        { cap:'', q:'مانیتور چه کاری می‌کنه؟',

        { cap:'', q:'مانیتور خودش دکمه‌ی پاور دارد؟',

        { cap:'', q:'روشنایی صفحه رو با چی کم و زیاد می‌کنی؟',

        { cap:'', q:'پایه‌ی مانیتور چه کاری می‌کنه؟',
          opts:['نگهش می‌دارد','روشنش می‌کند','تصویر می‌دهد'], a:0 },

        { cap:'', q:'کیس روشن است ولی مانیتور خاموش — چه می‌بینی؟',

    ]
