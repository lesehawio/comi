<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>کلیدهای مهم کیبورد — سطح ۱ / جلسه ۵ (۱ از ۲)</title>
<style>
/* ============================================================
   سطح ۱ — جلسه ۵ / بخش ۱ : کلیدهای مهم کیبورد
   Esc • Tab • Caps Lock • Shift • Ctrl
   Space • Enter • Backspace • Delete • کلیدهای جهت

   تک‌فایل • آفلاین • بدون تصویر بیرونی
   کیبورد با جاوااسکریپت ساخته می‌شود و دوربین روی هر کلید زوم می‌کند.

   برای عوض کردن درس‌ها → بخش «محتوای درس‌ها» در پایین فایل
   ============================================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:Tahoma,"Segoe UI",Arial,sans-serif;
    color:#e8edf5;
    direction:rtl;
    background:radial-gradient(ellipse 120% 70% at 50% 30%, #16202e 0%, #0d131c 45%, #080c12 100%);
}

#app{
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    position:relative;
}

/* =========================
   نوار بالا
   ========================= */

#top{
    flex:0 0 auto;
    padding:14px 16px 4px;
    display:flex;
    align-items:center;
    gap:12px;
}

#counter{
    flex:0 0 auto;
    font-size:13px;
    color:#7d8ba0;
    letter-spacing:.5px;
    min-width:52px;
    text-align:center;
    padding:7px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
}

#dots{
    flex:1;
    display:flex;
    gap:3px;
}

#dots i{
    flex:1;
    height:5px;
    border-radius:3px;
    background:#1e2733;
    transition:background .35s ease, box-shadow .35s ease;
}

#dots i.done{ background:#35845c; }
#dots i.now{
    background:#4ade80;
    box-shadow:0 0 9px rgba(74,222,128,.8);
}

#replay{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.045);
    color:#8b97a8;
    cursor:pointer;
    display:grid;
    place-items:center;
    padding:0;
    transition:transform .12s ease, background .2s;
}

#replay:active{
    transform:scale(.92);
    background:rgba(255,255,255,.1);
}

/* =========================
   صحنه
   ========================= */

#stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 8px 0;
    min-height:170px;
    position:relative;
}

#scene{
    width:100%;
    height:100%;
    touch-action:manipulation;
    overflow:visible;
}

/* کیبورد — دوربین با ترنسفورم جابه‌جا می‌شود */
#kb{
    transform-box:view-box;
    transform-origin:0 0;
    transition:transform .55s cubic-bezier(.2,.8,.3,1);
}

#kb g rect.kcap{
    fill:url(#gKey);
    stroke:#3d4655;
    stroke-width:1.4;
}

#kb g text.klab{
    fill:#c6d0de;
}

#kb g.part{ transition:opacity .35s ease; }

#scene.focusing #kb g.part{ opacity:.22; }

#scene.focusing #kb g.part.spot{
    opacity:1;
    filter:drop-shadow(0 0 9px rgba(74,222,128,.95));
}

#kb g.part.hit{
    filter:drop-shadow(0 0 14px rgba(74,222,128,1));
}

#kb g.part.hint{
    animation:hintPulse 1.1s ease-in-out infinite;
}

@keyframes hintPulse{
    0%,100%{ opacity:.3; }
    50%{ opacity:1; }
}

#spotRing{
    opacity:0;
    transition:opacity .3s ease;
}

#spotRing.show{
    opacity:1;
    animation:ringPulse 1.5s ease-in-out infinite;
}

@keyframes ringPulse{
    0%,100%{ stroke-width:2.5; opacity:.55; }
    50%{ stroke-width:5; opacity:1; }
}

#hintHand{
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}

#hintHand.show{ opacity:1; }

#hintHand.show #hintBounce{
    animation:bounceY .95s ease-in-out infinite;
}

@keyframes bounceY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-7px); }
}

#scene.shake{ animation:shakeIt .42s ease; }

@keyframes shakeIt{
    0%,100%{ transform:translateX(0); }
    18%{ transform:translateX(-8px); }
    38%{ transform:translateX(8px); }
    58%{ transform:translateX(-5px); }
    78%{ transform:translateX(5px); }
}

/* =========================
   پنل پایین
   ========================= */

#panel{
    flex:0 0 auto;
    background:linear-gradient(180deg,#161d28,#10161f);
    border-top:1px solid rgba(255,255,255,.07);
    border-radius:24px 24px 0 0;
    padding:20px 18px 22px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 34px rgba(0,0,0,.45);
    max-height:48vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

#panelInner{ animation:slideUp .34s ease; }

@keyframes slideUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
}

#title{
    font-size:23px;
    font-weight:bold;
    color:#4ade80;
    margin-bottom:9px;
    line-height:1.3;
}

#text{
    font-size:17.5px;
    line-height:1.8;
    color:#c6d0de;
    min-height:56px;
}

#actions{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
    align-content:flex-start;
}

.btn{
    flex:1;
    min-width:110px;
    min-height:64px;
    border-radius:17px;
    background:rgba(255,255,255,.06);
    color:#e8edf5;
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.09);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .12s ease, background .2s ease;
    padding:8px;
}

.btn:active{
    transform:scale(.955);
    background:rgba(255,255,255,.11);
}

.btn.main{
    background:linear-gradient(180deg,#45c97f,#2e9c5c);
    border-color:#5ee393;
    color:#05200f;
    box-shadow:0 8px 22px rgba(74,222,128,.28);
}

#startBig{
    width:196px;
    height:196px;
    border-radius:50%;
    border:3px solid #4ade80;
    background:radial-gradient(circle at 50% 38%,#204434,#0d1a14 70%);
    color:#4ade80;
    font-family:inherit;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    animation:breathe 2.4s ease-in-out infinite;
    transition:transform .12s ease;
}

@keyframes breathe{
    0%,100%{ box-shadow:0 0 32px rgba(74,222,128,.28), inset 0 0 22px rgba(74,222,128,.12); }
    50%{ box-shadow:0 0 62px rgba(74,222,128,.6), inset 0 0 32px rgba(74,222,128,.22); }
}

#startBig:active{ transform:scale(.95); }

/* =========================
   تأیید
   ========================= */

#burst{
    position:fixed;
    inset:0;
    display:none;
    place-items:center;
    pointer-events:none;
    z-index:50;
}

#burst.go{ display:grid; }

#burst .ring{
    width:132px;
    height:132px;
    border-radius:50%;
    border:5px solid #4ade80;
    animation:ringOut .8s cubic-bezier(.2,.7,.3,1) forwards;
}

@keyframes ringOut{
    from{ transform:scale(.32); opacity:.95; }
    to{ transform:scale(3.1); opacity:0; }
}

#burst .ok{
    position:absolute;
    width:86px;
    height:86px;
    filter:drop-shadow(0 0 20px rgba(74,222,128,.95));
    animation:popOk .85s ease-out forwards;
}

#burst .ok path{
    fill:none;
    stroke:#4ade80;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:72;
    stroke-dashoffset:72;
    animation:drawCheck .5s ease forwards .05s;
}

@keyframes drawCheck{
    to{ stroke-dashoffset:0; }
}

@keyframes popOk{
    0%{ transform:scale(.3); opacity:0; }
    42%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
}

.star{
    position:fixed;
    width:28px;
    height:28px;
    pointer-events:none;
    z-index:60;
    animation:starFly 1.5s ease-out forwards;
}

@keyframes starFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(1.25); opacity:0; }
}

@media (max-height:700px){
    #title{ font-size:20px; }
    #text{ font-size:15.5px; min-height:46px; line-height:1.7; }
    .btn{ min-height:56px; font-size:16.5px; }
    #startBig{ width:156px; height:156px; font-size:22px; }
    #panel{ padding:16px 16px 18px; }
    #dots{ gap:2px; }
}
</style>
</head>
<body>

<div id="app">

    <div id="top">
        <div id="counter">۰ / ۰</div>
        <div id="dots"></div>
        <button id="replay" title="دوباره" aria-label="دوباره">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.7-6"/>
                <path d="M20.5 3.5V9H15"/>
            </svg>
        </button>
    </div>

    <div id="stage">
        <svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="gKey" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#3d4655"/>
                    <stop offset="1" stop-color="#242b36"/>
                </linearGradient>
            </defs>

            <!-- کیبورد با جاوااسکریپت ساخته می‌شود -->
            <g id="kb"></g>

            <!-- حلقه‌ی نشانگر (بیرون از کیبورد، تا با زوم بزرگ نشود) -->
            <ellipse id="spotRing" cx="0" cy="0" rx="0" ry="0"
                     fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="10 8"
                     stroke-linecap="round"/>

            <!-- نشانگر هدف -->
            <g id="hintHand">
                <g id="hintBounce">
                    <circle cx="0" cy="-16" r="13" fill="none" stroke="#4ade80" stroke-width="2.6" opacity=".5"/>
                    <circle cx="0" cy="-16" r="4" fill="#4ade80" opacity=".85"/>
                    <path d="M0 -3 L0 15" stroke="#4ade80" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M-8.5 6.5 L0 17 L8.5 6.5" fill="none" stroke="#4ade80"
                          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>
        </svg>
    </div>

    <div id="panel">
        <div id="panelInner">
            <div id="title"></div>
            <div id="text"></div>
            <div id="actions"></div>
        </div>
    </div>

</div>

<div id="burst"></div>

<script>
/* ============================================================
   ۱) محتوای درس‌ها
   ============================================================ */

var PARTS = {
    space:     ['فاصله (Space)',  'بزرگ‌ترین کلید کیبورده. بین کلمه‌ها فاصله می‌ندازه.'],
    enter:     ['اینتر (Enter)',  'کارت رو تأیید می‌کنه. توی نوشتن، می‌ره خط بعد.'],
    backspace: ['پاک کردن (Back)','حرف‌های قبلی رو پاک می‌کنه.'],
    shift:     ['شیفت (Shift)',   'با این حرف بزرگ می‌نویسی. یا علامت بالای کلید رو می‌گیری.'],
    caps:      ['کپس‌لاک (Caps)', 'همه‌ی حرفا رو بزرگ می‌کنه. اگر روشن بمونه، گیج می‌شی.'],
    tab:       ['تب (Tab)',       'می‌پره خونه‌ی بعدی. توی فرم‌ها به کار میاد.'],
    ctrl:      ['کنترل (Ctrl)',   'تنها کاری نمی‌کنه — باید با یه کلید دیگه بزنی.'],
    esc:       ['اسکیپ (Esc)',    'یعنی بی‌خیال شو. پنجره یا منو رو می‌بنده.'],
    del:       ['دیلیت (Delete)', 'حرف جلویی رو پاک می‌کنه. برعکس بک‌اسپیس.'],
    arrows:    ['کلیدهای جهت',    'با این چهار تا، نشانگر رو می‌بری بالا و پایین و چپ و راست.']
};

/* هر کلید در کدام ناحیه دیده می‌شود */
var KEY_ZONE = {
    space:'mid', enter:'mid', backspace:'mid',
    shift:'left', caps:'left', tab:'left', ctrl:'left', esc:'left',
    del:'nav', arrows:'nav'
};

/* ترتیب درس‌ها */
var LESSON = [
    { t:'intro' },

    { t:'teach', part:'space'     },
    { t:'teach', part:'enter'     },
    { t:'teach', part:'backspace' },
    { t:'teach', part:'shift'     },
    { t:'teach', part:'caps'      },
    { t:'teach', part:'tab'       },
    { t:'teach', part:'ctrl'      },
    { t:'teach', part:'esc'       },
    { t:'teach', part:'del'       },
    { t:'teach', part:'arrows'    },

    { t:'find',  part:'space',     ask:'کلید فاصله رو پیدا کن'      },
    { t:'find',  part:'enter',     ask:'کلید اینتر رو پیدا کن'      },
    { t:'find',  part:'backspace', ask:'کلید پاک کردن رو پیدا کن'   },
    { t:'find',  part:'shift',     ask:'کلید شیفت رو پیدا کن'       },
    { t:'find',  part:'caps',      ask:'کلید کپس‌لاک رو پیدا کن'    },
    { t:'find',  part:'tab',       ask:'کلید تب رو پیدا کن'         },
    { t:'find',  part:'ctrl',      ask:'کلید کنترل رو پیدا کن'      },
    { t:'find',  part:'esc',       ask:'کلید اسکیپ رو پیدا کن'      },
    { t:'find',  part:'del',       ask:'کلید دیلیت رو پیدا کن'      },
    { t:'find',  part:'arrows',    ask:'کلیدهای جهت رو پیدا کن'     },

    { t:'chain', parts:['space','enter','backspace','shift','ctrl','tab'] }
];

/* ============================================================
   ۲) ساخت کیبورد
   ============================================================ */

var U  = 50;   /* یک واحد کیبورد */
var KX = 7;    /* فاصله‌ی بین کلیدها */

/* [برچسب، عرض، شناسه‌ی قطعه، متنی که نشان داده می‌شود] */
var ROWS = [
    { y:0, h:0.55, keys:[
        ['Esc',1,'esc'], ['',0.5],
        ['F1',1], ['F2',1], ['F3',1], ['F4',1], ['',0.4],
        ['F5',1], ['F6',1], ['F7',1], ['F8',1], ['',0.4],
        ['F9',1], ['F10',1], ['F11',1], ['F12',1]
    ]},
    { y:0.55, h:1, keys:[
        ['`',1], ['1',1], ['2',1], ['3',1], ['4',1], ['5',1], ['6',1],
        ['7',1], ['8',1], ['9',1], ['0',1], ['-',1], ['=',1],
        ['Back',2,'backspace']
    ]},
    { y:1.55, h:1, keys:[
        ['Tab',1.5,'tab'],
        ['q',1], ['w',1], ['e',1], ['r',1], ['t',1], ['y',1], ['u',1],
        ['i',1], ['o',1], ['p',1], ['[',1], [']',1], ['\\',1.5]
    ]},
    { y:2.55, h:1, keys:[
        ['Caps',1.75,'caps'],
        ['a',1], ['s',1], ['d',1], ['f',1], ['g',1], ['h',1], ['j',1],
        ['k',1], ['l',1], [';',1], ["'",1],
        ['Enter',2.25,'enter']
    ]},
    { y:3.55, h:1, keys:[
        ['Shift',2.25,'shift'],
        ['z',1], ['x',1], ['c',1], ['v',1], ['b',1], ['n',1], ['m',1],
        [',',1], ['.',1], ['/',1],
        ['Shift',2.75,'shift']
    ]},
    { y:4.55, h:1, keys:[
        ['Ctrl',1.25,'ctrl'], ['Win',1.25], ['Alt',1.25,'alt'],
        ['Space',6.25,'space',''],
        ['Alt',1.25,'alt'], ['Win',1.25], ['Menu',1.25], ['Ctrl',1.25,'ctrl']
    ]}
];

var NAV = [
    { x:15.5, y:1.55, label:'Ins'  },
    { x:16.5, y:1.55, label:'Home' },
    { x:17.5, y:1.55, label:'PgUp' },
    { x:15.5, y:2.55, label:'Del', part:'del' },
    { x:16.5, y:2.55, label:'End'  },
    { x:17.5, y:2.55, label:'PgDn' },
    { x:16.5, y:3.55, label:'up',    part:'arrows' },
    { x:15.5, y:4.55, label:'left',  part:'arrows' },
    { x:16.5, y:4.55, label:'down',  part:'arrows' },
    { x:17.5, y:4.55, label:'right', part:'arrows' }
];

var uid = 0;

function htmlEsc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function arrowPath(dir, cx, cy){
    var r = 11;
    var d = '';
    if(dir === 'up'){
        d = 'M' + cx + ',' + (cy-r) + ' L' + (cx+r*0.85) + ',' + (cy+r*0.7) + ' L' + (cx-r*0.85) + ',' + (cy+r*0.7) + ' Z';
    } else if(dir === 'down'){
        d = 'M' + cx + ',' + (cy+r) + ' L' + (cx+r*0.85) + ',' + (cy-r*0.7) + ' L' + (cx-r*0.85) + ',' + (cy-r*0.7) + ' Z';
    } else if(dir === 'left'){
        d = 'M' + (cx-r) + ',' + cy + ' L' + (cx+r*0.7) + ',' + (cy-r*0.85) + ' L' + (cx+r*0.7) + ',' + (cy+r*0.85) + ' Z';
    } else {
        d = 'M' + (cx+r) + ',' + cy + ' L' + (cx-r*0.7) + ',' + (cy-r*0.85) + ' L' + (cx-r*0.7) + ',' + (cy+r*0.85) + ' Z';
    }
    return '<path d="' + d + '" fill="#c6d0de"/>';
}

function keySvg(x, y, w, h, disp, part, name){
    var px = x * U + KX / 2;
    var py = y * U + KX / 2;
    var pw = w * U - KX;
    var ph = h * U - KX;
    var cx = px + pw / 2;
    var cy = py + ph / 2;
    var isArrow = (name === 'up' || name === 'down' || name === 'left' || name === 'right');
    var pid = part ? part : ('k' + (uid++));
    var s = '';

    s += '<g data-part="' + pid + '" class="part">';
    s += '<rect class="kcap" x="' + px.toFixed(1) + '" y="' + py.toFixed(1) +
         '" width="' + pw.toFixed(1) + '" height="' + ph.toFixed(1) +
         '" rx="' + Math.min(9, ph / 4).toFixed(1) + '"/>';

    if(disp){
        if(isArrow){
            s += arrowPath(name, cx, cy);
        } else {
            var fs = Math.min(20, pw * 0.34, ph * 0.44);
            if(String(disp).length > 4){ fs = Math.min(fs, pw / String(disp).length * 1.5); }
            s += '<text class="klab" x="' + cx.toFixed(1) + '" y="' + (cy + fs * 0.36).toFixed(1) +
                 '" text-anchor="middle" font-size="' + fs.toFixed(1) +
                 '" font-family="Tahoma">' + htmlEsc(disp) + '</text>';
        }
    }

    /* ناحیه‌ی لمس، کمی بزرگ‌تر از خود کلید */
    s += '<rect x="' + (px - 5).toFixed(1) + '" y="' + (py - 5).toFixed(1) +
         '" width="' + (pw + 10).toFixed(1) + '" height="' + (ph + 10).toFixed(1) +
         '" rx="11" fill="transparent" pointer-events="all"/>';
    s += '</g>';
    return s;
}

function buildKeyboard(){
    var out = '';
    var r, k, x, row, key, label, w, part, disp;

    for(r=0; r<ROWS.length; r++){
        row = ROWS[r];
        x = 0;
        for(k=0; k<row.keys.length; k++){
            key = row.keys[k];
            label = key[0];
            w     = key[1];
            part  = key[2];
            disp  = (key.length > 3) ? key[3] : label;
            if(label !== ''){
                out += keySvg(x, row.y, w, row.h, disp, part, label);
            }
            x += w;
        }
    }

    for(k=0; k<NAV.length; k++){
        var n = NAV[k];
        out += keySvg(n.x, n.y, 1, 1, n.label, n.part, n.label);
    }

    document.getElementById('kb').innerHTML = out;
}

/* ============================================================
   ۳) موتور برنامه
   ============================================================ */

var scene    = document.getElementById('scene');
var kb       = document.getElementById('kb');
var dotsEl   = document.getElementById('dots');
var countEl  = document.getElementById('counter');
var replayEl = document.getElementById('replay');
var titleEl  = document.getElementById('title');
var textEl   = document.getElementById('text');
var actEl    = document.getElementById('actions');
var burstEl  = document.getElementById('burst');
var panelIn  = document.getElementById('panelInner');
var handEl   = document.getElementById('hintHand');
var ringEl   = document.getElementById('spotRing');

var i = 0;
var chainIdx = 0;
var wrongCount = 0;
var lock = false;

var camTX = 0, camTY = 0, camS = 1;

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
    return String(n).replace(/[0-9]/g, function(d){ return FA[+d]; });
}

function vibrate(p){
    if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} }
}

function findPart(node){
    while(node && node !== scene){
        if(node.getAttribute && node.getAttribute('data-part')){
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function partEls(name){
    return kb.querySelectorAll('[data-part="' + name + '"]');
}

function partEl(name){
    var els = partEls(name);
    return els.length ? els[0] : null;
}

function markSpot(name){
    var els = partEls(name);
    for(var j=0;j<els.length;j++){ els[j].classList.add('spot'); }
}

/* ---------------- دوربین ---------------- */

var ZONES = {
    full: [0,    0,   18.5, 5.55],
    left: [0,    0,   7.2,  5.55],
    mid:  [3.0,  0.5, 12.2, 5.05],
    nav:  [15.1, 1.4, 3.4,  4.15]
};

function setCamera(zoneName){
    var z = ZONES[zoneName] || ZONES.full;
    var zx = z[0] * U;
    var zy = z[1] * U;
    var zw = z[2] * U;
    var zh = z[3] * U;

    camS = Math.min(400 / zw, 300 / zh) * 0.90;
    camTX = 200 - camS * (zx + zw / 2);
    camTY = 150 - camS * (zy + zh / 2);

    kb.style.transform = 'translate(' + camTX.toFixed(1) + 'px,' + camTY.toFixed(1) + 'px) scale(' + camS.toFixed(4) + ')';
}

function clearMarks(){
    var all = kb.querySelectorAll('.part');
    for(var k=0;k<all.length;k++){
        all[k].classList.remove('spot','hit','hint');
    }
    scene.classList.remove('focusing','shake');
    handEl.classList.remove('show');
    ringEl.classList.remove('show');
}

function showRing(part){
    var el = partEl(part);
    if(!el || !el.getBBox) return;
    var b;
    try{ b = el.getBBox(); }catch(e){ return; }
    ringEl.setAttribute('cx', camTX + camS * (b.x + b.width / 2));
    ringEl.setAttribute('cy', camTY + camS * (b.y + b.height / 2));
    ringEl.setAttribute('rx', camS * (b.width / 2) + 9);
    ringEl.setAttribute('ry', camS * (b.height / 2) + 9);
    ringEl.classList.add('show');
}

function showHand(part){
    var el = partEl(part);
    if(!el || !el.getBBox) return;
    var b;
    try{ b = el.getBBox(); }catch(e){ return; }
    var cx = camTX + camS * (b.x + b.width / 2);
    var ty = camTY + camS * b.y;
    handEl.setAttribute('transform','translate(' + cx.toFixed(1) + ',' + (ty - 8).toFixed(1) + ')');
    handEl.classList.add('show');
}

/* ---------------- بازخورد ---------------- */

function showBurst(){
    burstEl.innerHTML =
        '<div class="ring"></div>' +
        '<svg class="ok" viewBox="0 0 64 64">' +
        '<path d="M13 33 L26 46 L51 18"/></svg>';
    burstEl.classList.add('go');
    setTimeout(function(){
        burstEl.classList.remove('go');
        burstEl.innerHTML = '';
    }, 850);
}

function stars(){
    for(var k=0;k<16;k++){
        (function(){
            var s = document.createElement('div');
            s.className = 'star';
            s.innerHTML = '<svg viewBox="0 0 24 24" width="28" height="28">' +
                          '<path d="M12 2.2l2.95 6.05 6.65.95-4.8 4.7 1.15 6.65L12 17.4l-5.95 3.15L7.2 13.9 2.4 9.2l6.65-.95z" ' +
                          'fill="#ffd257"/></svg>';
            s.style.left = (20 + Math.random()*60) + '%';
            s.style.top  = (28 + Math.random()*25) + '%';
            s.style.setProperty('--dx', (Math.random()*300 - 150) + 'px');
            s.style.setProperty('--dy', (Math.random()*-320 - 60) + 'px');
            document.body.appendChild(s);
            setTimeout(function(){ s.remove(); }, 1600);
        })();
    }
}

function setButtons(list){
    actEl.innerHTML = '';
    for(var k=0;k<list.length;k++){
        (function(item){
            var b = document.createElement('button');
            b.className = 'btn' + (item.cls ? ' ' + item.cls : '');
            b.textContent = item.label;
            b.onclick = item.onClick;
            actEl.appendChild(b);
        })(list[k]);
    }
}

function replayAnim(){
    panelIn.style.animation = 'none';
    void panelIn.offsetWidth;
    panelIn.style.animation = '';
}

/* ---------------- نمایش مرحله ---------------- */

function render(){
    var s = LESSON[i];
    lock = false;
    wrongCount = 0;
    chainIdx = 0;
    clearMarks();
    replayAnim();

    var html = '';
    for(var k=0;k<LESSON.length;k++){
        html += '<i class="' + (k < i ? 'done' : (k === i ? 'now' : '')) + '"></i>';
    }
    dotsEl.innerHTML = html;
    countEl.textContent = fa(i + 1) + ' / ' + fa(LESSON.length);

    /* ---------- ورود ---------- */
    if(s.t === 'intro'){
        setCamera('full');
        titleEl.textContent = 'کیبورد رو بشناسیم';
        textEl.textContent  = 'این همه‌ی کیبورده. بریم کلیدهای مهمش رو یکی‌یکی ببینیم.';
        actEl.innerHTML = '';
        var big = document.createElement('button');
        big.id = 'startBig';
        big.textContent = 'شروع';
        big.onclick = next;
        actEl.appendChild(big);
        return;
    }

    /* ---------- معرفی کلید ---------- */
    if(s.t === 'teach'){
        setCamera(KEY_ZONE[s.part] || 'full');
        scene.classList.add('focusing');
        markSpot(s.part);
        setTimeout(function(){ showRing(s.part); }, 560);
        titleEl.textContent = PARTS[s.part][0];
        textEl.textContent  = PARTS[s.part][1];
        setButtons([{ label:'بعدی', cls:'main', onClick:next }]);
        return;
    }

    /* ---------- پیدا کن ---------- */
    if(s.t === 'find'){
        setCamera(KEY_ZONE[s.part] || 'full');
        titleEl.textContent = 'پیدا کن';
        textEl.textContent  = s.ask;
        setButtons([]);
        return;
    }

    /* ---------- زنجیره‌ی پایانی ---------- */
    if(s.t === 'chain'){
        renderChain();
        return;
    }
}

function renderChain(){
    var s = LESSON[i];
    var want = s.parts[chainIdx];
    clearMarks();
    setCamera(KEY_ZONE[want] || 'full');
    titleEl.textContent = 'نشونم بده';
    textEl.textContent  = PARTS[want][0] + ' رو پیدا کن   (' +
                          fa(chainIdx + 1) + ' از ' + fa(s.parts.length) + ')';
    setButtons([]);
}

function next(){
    if(i < LESSON.length - 1){
        i++;
        render();
    }
}

function correct(el){
    if(lock) return;
    lock = true;
    if(el){ el.classList.add('hit'); }
    handEl.classList.remove('show');
    vibrate([35, 40, 35]);
    showBurst();

    setTimeout(function(){
        var s = LESSON[i];

        if(s.t === 'chain'){
            if(chainIdx < s.parts.length - 1){
                chainIdx++;
                lock = false;
                renderChain();
            } else {
                stars();
                titleEl.textContent = 'آفرین!';
                textEl.textContent  = 'کلیدهای مهم کیبورد رو شناختی. حالا برو سراغ میانبرها.';
                setButtons([{ label:'از اول', cls:'main', onClick: function(){ i = 0; render(); } }]);
            }
            return;
        }

        if(i < LESSON.length - 1){ i++; render(); }
        else { lock = false; }
    }, 880);
}

function wrongAnswer(){
    if(lock) return;
    wrongCount++;
    vibrate(60);
    scene.classList.add('shake');
    setTimeout(function(){ scene.classList.remove('shake'); }, 440);
    textEl.textContent = 'این یکی نه. یه بار دیگه.';

    var s = LESSON[i];
    var want = s.t === 'chain' ? s.parts[chainIdx] : s.part;

    if(wrongCount >= 2 && want){
        var els = partEls(want);
        for(var j=0;j<els.length;j++){ els[j].classList.add('hint'); }
        setTimeout(function(){ showHand(want); }, 120);
        if(s.t !== 'chain'){ showRing(want); }
    }
}

/* ---------------- کلیک روی کیبورد ---------------- */

kb.addEventListener('click', function(e){
    if(lock) return;
    var g = findPart(e.target);
    if(!g) return;
    var tapped = g.getAttribute('data-part');
    var s = LESSON[i];

    if(s.t === 'find'){
        if(tapped === s.part){ correct(g); } else { wrongAnswer(); }
    }
    else if(s.t === 'chain'){
        if(tapped === s.parts[chainIdx]){ correct(g); } else { wrongAnswer(); }
    }
});

replayEl.onclick = function(){
    vibrate(20);
    render();
};

/* ---------------- جلوگیری از زوم ---------------- */

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){
    if(e.touches.length > 1){ e.preventDefault(); }
}, { passive:false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });

/* ---------------- شروع ---------------- */

buildKeyboard();
render();
</script>

</body>
</html>
