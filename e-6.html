window.EXAM = {
    no: 6,
    title: 'امتحان ۶ — پنج میانبر اصلی',
    qs: [
        { cap:'Ctrl + C', q:'این چیکار می‌کنه؟',
          opts:['کپی می‌کنه','چاپ می‌کنه','می‌بنده'], a:0 },

        { cap:'Ctrl + V', q:'این چیکار می‌کنه؟',

        { cap:'Ctrl + X', q:'این چیکار می‌کنه؟',

        { cap:'Ctrl + Z', q:'این چیکار می‌کنه؟',
          opts:['تازه‌سازی می‌کنه','برمی‌گردونه','ذخیره می‌کنه'], a:1 },

        { cap:'Ctrl + S', q:'این چیکار می‌کنه؟',
          opts:['ذخیره می‌کنه','چاپ می‌کنه','پاک می‌کنه'], a:0 },

        { cap:'', q:'اشتباه کردی — کدوم میانبر نجاتت می‌ده؟',
          opts:['Ctrl + Z','Ctrl + S','Ctrl + C'], a:0 },

        { cap:'', q:'کدوم میانبر رو باید هر چند دقیقه بزنی؟',
          opts:['Ctrl + S','Ctrl + X','Ctrl + V'], a:0 },

        { cap:'', q:'Ctrl + X چه فرقی با Ctrl + C داره؟',
          opts:['اصل را هم برمی‌داره','فقط کپی می‌کنه','چاپ می‌کنه'], a:0 }
    ]
};
</script>
